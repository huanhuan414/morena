services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mrl}
      MYSQL_USER: ${MYSQL_USER:-mrl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mrl_local_password}
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mrl}
      MYSQL_USER: ${MYSQL_USER:-mrl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mrl_local_password}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  server-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mrl}
      MYSQL_USER: ${MYSQL_USER:-mrl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mrl_local_password}
    command: ["pnpm", "--filter", "server", "dev"]
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server:/app/server
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.web-dev
    restart: unless-stopped
    depends_on:
      server-dev:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: 5000
      PROJECT_DOMAIN: ""
      H5_API_PROXY_TARGET: http://server-dev:3000
    command: ["pnpm", "dev:web"]
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./babel.config.js:/app/babel.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./project.config.json:/app/project.config.json:ro
      - ./project.tt.json:/app/project.tt.json:ro
      - ./patches:/app/patches:ro
      - ./config:/app/config
      - ./public:/app/public
      - ./src:/app/src

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_BASE_URL: http://server:3000
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-15000}
      API_CONCURRENCY: ${API_CONCURRENCY:-2}
    command: ["pnpm", "test"]

volumes:
  mysql_data:
  uploads_data:
