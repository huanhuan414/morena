<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>分身平台 - 完整业务原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f8fafc;color:#1e293b;font-size:14px;max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.app{min-height:100vh;padding-bottom:68px}
.page{display:none;padding-bottom:20px}.page.active{display:block}
.subpage{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100%;background:#f8fafc;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideIn .25s ease}
.subpage.closing{animation:slideOut .2s ease forwards}
@keyframes slideIn{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
@keyframes slideOut{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(100%)}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center}.modal-overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:24px 20px 32px;animation:modalUp .25s ease}
@keyframes modalUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;align-items:center;justify-content:space-around;height:60px;border-top:1px solid #f1f5f9;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#94a3b8;cursor:pointer;transition:.15s}.tabbar-item.active{color:#7B3FE4}
.tabbar-item .tab-icon{font-size:20px;height:24px;line-height:24px}
.tabbar-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar-center-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 4px 12px rgba(99,102,241,.4);margin-top:-18px}
.tabbar-center-text{font-size:10px;color:#94a3b8}.tabbar-center.active .tabbar-center-text{color:#7B3FE4}
.gradient-header{background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);padding:48px 20px 20px;color:#fff;border-radius:0 0 24px 24px;position:relative}
.gradient-header h1{font-size:22px;font-weight:700;margin-bottom:4px}.gradient-header p{font-size:13px;opacity:.85}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header-actions{display:flex;gap:12px;align-items:center}
.header-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:none}
.stats-row{display:flex;gap:10px;margin-top:14px}
.stat-card{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 8px;text-align:center;backdrop-filter:blur(8px)}
.stat-val{font-size:20px;font-weight:700}.stat-label{font-size:10px;opacity:.8;margin-top:2px}
.section{padding:0 16px;margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:16px;font-weight:700}.section-more{font-size:12px;color:#6366f1;cursor:pointer}
.avatar-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:10px}
.avatar-top{display:flex;align-items:center;gap:12px}
.avatar-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid #e9e5ff;flex-shrink:0;background:#f3f0ff}
.avatar-photo.lg{width:64px;height:64px;border-width:3px}.avatar-photo.sm{width:40px;height:40px;border-width:2px}
.avatar-photo.ring-gold{border-color:#fbbf24}.avatar-photo.ring-purple{border-color:#8b5cf6}
.avatar-info{flex:1;min-width:0}
.avatar-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.lv{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}
.lv1{background:#f1f5f9;color:#64748b}.lv2{background:#dbeafe;color:#3b82f6}.lv3{background:#d1fae5;color:#059669}.lv4{background:#fef3c7;color:#d97706}.lv5{background:#ede9fe;color:#7c3aed}.lv6{background:#fce7f3;color:#db2777}.lv7{background:#fef2f2;color:#dc2626}
.avatar-meta{font-size:12px;color:#94a3b8;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.avatar-status{font-size:11px;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
.st-work{background:#fef3c7;color:#d97706}.st-idle{background:#dcfce7;color:#16a34a}.st-learn{background:#dbeafe;color:#2563eb}.st-off{background:#f1f5f9;color:#94a3b8}
.avatar-skills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.skill-tag{font-size:11px;padding:3px 8px;border-radius:6px;background:#f3f0ff;color:#6d28d9}
.skill-tag.mastered{background:#ede9fe;color:#5b21b6}
.skill-tag.learning{background:#fef3c7;color:#92400e;border:1px dashed #fbbf24}
.avatar-acts{display:flex;gap:8px;margin-top:10px}
.act-btn{flex:1;padding:8px 0;border-radius:10px;font-size:13px;font-weight:500;text-align:center;cursor:pointer;border:none;transition:.15s}.act-btn:active{transform:scale(.96)}
.act-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.act-secondary{background:#f3f0ff;color:#6d28d9}
.act-disabled{background:#f1f5f9;color:#cbd5e1;cursor:not-allowed}
.act-danger{background:#fef2f2;color:#ef4444}
.act-success{background:#dcfce7;color:#16a34a}
.avatar-big{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px}
.avatar-cover{height:120px;position:relative;overflow:hidden}
.avatar-cover img.cov{width:100%;height:100%;object-fit:cover}
.avatar-cover-overlay{position:absolute;bottom:0;left:0;right:0;height:70px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.avatar-cover-photo{position:absolute;bottom:-24px;left:16px;z-index:2}
.avatar-cover-photo img{width:56px;height:56px;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.avatar-cover-info{position:absolute;bottom:10px;left:84px;right:14px}
.avatar-cover-name{color:#fff;font-size:17px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.avatar-cover-meta{color:rgba(255,255,255,.9);font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.avatar-cover-edit{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:none;z-index:2}
.avatar-big-body{padding:16px 14px 14px}
.avatar-big-stats{display:flex;gap:0;margin-bottom:10px}
.avatar-big-stat{flex:1;text-align:center;border-right:1px solid #f1f5f9}.avatar-big-stat:last-child{border:none}
.avatar-big-stat .val{font-size:16px;font-weight:700;color:#1e293b}.avatar-big-stat .label{font-size:10px;color:#94a3b8;margin-top:1px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.quick-item{background:rgba(255,255,255,.18);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}.quick-item:active{transform:scale(.94)}
.quick-item .icon{font-size:22px;margin-bottom:4px}.quick-item .text{font-size:11px;color:#fff}
.talk-bar{background:#fff;border-radius:16px;padding:12px;margin:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-top:14px}
.talk-input-row{display:flex;gap:8px;align-items:center}
.talk-input{flex:1;border:none;outline:none;font-size:14px;padding:10px 14px;background:#f3f0ff;border-radius:20px;color:#1e293b}.talk-input::placeholder{color:#a78bfa}
.talk-send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.talk-send:active{transform:scale(.92)}
.quick-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick-tag{font-size:11px;padding:4px 10px;border-radius:12px;background:#f3f0ff;color:#6d28d9;cursor:pointer;white-space:nowrap}.quick-tag:active{background:#ede9fe}
.chat-messages{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:#f3f0ff;color:#1e293b;border-bottom-left-radius:4px}
.sub-header{display:flex;align-items:center;padding:48px 16px 14px;background:#fff;border-bottom:1px solid #f1f5f9;position:sticky;top:0;z-index:10}
.sub-back{width:32px;height:32px;border-radius:50%;background:#f3f0ff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6d28d9}
.sub-title{flex:1;text-align:center;font-size:16px;font-weight:600;margin:0 8px}
.sub-header-btn{padding:6px 14px;border-radius:8px;font-size:12px;border:none;cursor:pointer;font-weight:500}
.sub-body{padding:16px}
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;display:block}
.form-label .req{color:#ef4444}
.form-input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;transition:.2s;background:#fff}.form-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.form-textarea{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;resize:vertical;min-height:80px}.form-textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.form-hint{font-size:11px;color:#94a3b8;margin-top:4px}
.form-chips{display:flex;flex-wrap:wrap;gap:8px}
.form-chip{padding:6px 14px;border-radius:20px;font-size:12px;border:1.5px solid #e2e8f0;cursor:pointer;transition:.15s;background:#fff}.form-chip.selected{border-color:#8b5cf6;background:#ede9fe;color:#5b21b6}
.form-photo-upload{width:80px;height:80px;border-radius:50%;border:2px dashed #d4d4d8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#fafafa;flex-shrink:0}
.form-photo-upload img{width:100%;height:100%;object-fit:cover}
.form-photo-upload .ph{font-size:28px;color:#d4d4d8}.form-photo-upload .pt{font-size:9px;color:#94a3b8;margin-top:2px}
.form-cover-upload{flex:1;height:80px;border-radius:12px;border:2px dashed #d4d4d8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#fafafa;flex-shrink:0}
.form-cover-upload img{width:100%;height:100%;object-fit:cover}
.form-cover-upload .ph{font-size:24px;color:#d4d4d8}.form-cover-upload .pt{font-size:9px;color:#94a3b8;margin-top:2px}
.tab-row{display:flex;gap:0;background:#fff;border-bottom:1px solid #f1f5f9;padding:0 16px}
.tab-item{flex:1;padding:10px 0;font-size:13px;color:#94a3b8;text-align:center;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}.tab-item.active{color:#6d28d9;border-bottom-color:#6d28d9}
.tab-content{display:none;padding:16px}.tab-content.active{display:block}
.progress-bar{height:8px;background:#f1f5f9;border-radius:8px;overflow:hidden}.progress-fill{height:100%;border-radius:8px;transition:width .6s ease}
.pf-purple{background:linear-gradient(90deg,#6366f1,#a855f7)}.pf-green{background:linear-gradient(90deg,#22c55e,#16a34a)}.pf-gold{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.price-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.price-row .label{color:#64748b}.price-row .val{font-weight:600}
.price-row.total{border-top:1px solid #f1f5f9;padding-top:10px;margin-top:6px;font-size:16px}.price-row.total .val{color:#6d28d9}
.level-node{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f8fafc}.level-node:last-child{border:none}
.level-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;color:#fff}
.level-info{flex:1}.level-name{font-size:14px;font-weight:600}.level-perks{font-size:12px;color:#64748b;margin-top:2px;line-height:1.6}
.level-locked{opacity:.4}.level-current .level-badge{box-shadow:0 0 0 3px #fff,0 0 0 5px #8b5cf6}
.search-bar{display:flex;gap:8px;padding:0 16px;margin-bottom:12px;position:relative}
.search-input{flex:1;padding:10px 14px 10px 36px;background:#fff;border-radius:20px;border:1.5px solid #e2e8f0;font-size:13px;outline:none}.search-input:focus{border-color:#8b5cf6}
.search-ico{position:absolute;left:28px;top:10px;font-size:14px;color:#94a3b8}
.filter-row{display:flex;gap:6px;padding:0 16px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}.filter-row::-webkit-scrollbar{display:none}
.filter-chip{white-space:nowrap;padding:6px 14px;border-radius:16px;font-size:12px;background:#fff;border:1px solid #e2e8f0;cursor:pointer;flex-shrink:0}.filter-chip.active{background:#6d28d9;color:#fff;border-color:#6d28d9}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notify-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f8fafc;cursor:pointer}
.notify-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.notify-content{flex:1;min-width:0}.notify-title{font-size:14px;font-weight:500}.notify-desc{font-size:12px;color:#64748b;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notify-time{font-size:10px;color:#cbd5e1;margin-top:2px}
.notify-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0;margin-top:6px}.notify-dot.read{background:transparent}
.checkin-card{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.checkin-info h3{font-size:15px;font-weight:700;color:#92400e}.checkin-info p{font-size:12px;color:#b45309;margin-top:2px}
.checkin-days{display:flex;gap:4px;margin-top:6px}
.checkin-day{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.checkin-day.done{background:#f59e0b;color:#fff}.checkin-day.current{background:#fff;color:#f59e0b;border:2px solid #f59e0b}.checkin-day.future{background:#fef3c7;color:#d97706}
.checkin-btn{padding:10px 20px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer}.checkin-btn:active{transform:scale(.95)}
.checkin-btn.available{background:#f59e0b;color:#fff;box-shadow:0 4px 12px rgba(245,158,11,.3)}.checkin-btn.done{background:#fff;color:#d97706}
.menu-list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.menu-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f8fafc;cursor:pointer}.menu-item:last-child{border:none}.menu-item:active{background:#f8fafc}
.menu-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:12px;flex-shrink:0}
.menu-text{flex:1;font-size:14px}.menu-arrow{color:#cbd5e1;font-size:12px}
.menu-badge{background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-right:8px}
.order-type{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:6px}
.ot-urgent{background:#fef2f2;color:#ef4444}.ot-new{background:#eff6ff;color:#3b82f6}.ot-normal{background:#f0fdf4;color:#22c55e}
.order-title{font-size:15px;font-weight:600;margin-bottom:4px}.order-desc{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:8px}
.order-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.order-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#f1f5f9;color:#64748b}
.order-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid #f8fafc}
.order-price{font-size:18px;font-weight:700;color:#6d28d9}.order-earning{font-size:12px;color:#22c55e}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f8fafc}.switch-row:last-child{border:none}
.switch-label{font-size:14px}.switch-desc{font-size:11px;color:#94a3b8;margin-top:2px}
.sw{width:44px;height:24px;border-radius:12px;background:#e2e8f0;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}.sw.on{background:#8b5cf6}
.sw .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}.sw.on .knob{left:22px}
.coverage-bar{display:flex;height:20px;border-radius:10px;overflow:hidden;margin:4px 0}.coverage-filled{background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .4s}.coverage-empty{background:#f1f5f9;flex:1}
.plaza-grid-item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;transition:.15s}.plaza-grid-item:active{transform:scale(.97)}
.plaza-grid-photo{width:100%;aspect-ratio:1;object-fit:cover}.plaza-grid-body{padding:10px}
.plaza-grid-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}.plaza-grid-meta{font-size:10px;color:#94a3b8;margin-top:2px}
.plaza-grid-skills{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.plaza-grid-skill{font-size:9px;padding:1px 5px;border-radius:4px;background:#f3f0ff;color:#6d28d9}
.plaza-grid-price{font-size:13px;font-weight:700;color:#6d28d9;margin-top:6px}
.plaza-grid-hire{padding:6px 14px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-size:11px;cursor:pointer;font-weight:500}
.earn-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:8px 0}
.earn-bar{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#8b5cf6,#6366f1);min-width:20px;position:relative;transition:height .5s ease}
.earn-bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:#94a3b8;white-space:nowrap}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:500;animation:toastIn .3s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.edit-panel{background:#fff;border-radius:20px;padding:24px 20px}
.edit-title{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center}
.result-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:10px}
.result-type{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:6px}
.rt-done{background:#dcfce7;color:#16a34a}.rt-gen{background:#dbeafe;color:#2563eb}
.withdraw-method{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.withdraw-method.selected{border-color:#8b5cf6;background:#faf5ff}
.withdraw-method .icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}

function matchBestSkill(avatar, taskType) {
  const skills = avatar.skills || [];
  let bestSkill = null, bestScore = 0;
  for (const skillName of skills) {
    const output = SKILL_OUTPUT[skillName];
    if (output && output.taskTypes.includes(taskType)) {
      const ab = avatar.abilities || {};
      const score = Object.values(ab).reduce((s,v)=>s+v,0);
      if (score > bestScore) { bestScore = score; bestSkill = skillName; }
    }
  }
  return bestSkill;
}

function generateWorkOutput(avatar, taskDesc, taskType) {
  const matchedSkill = matchBestSkill(avatar, taskType);
  if (matchedSkill) {
    const result = SKILL_OUTPUT[matchedSkill].generate(avatar, taskDesc);
    return { hasSkill:true, skillUsed:matchedSkill, quality:result.quality, title:result.title, content:result.content, hashtags:result.hashtags||[], score:result.score, avatarName:avatar.name };
  }
  const genericOutputs = { '图文笔记':{quality:'D',title:'产品分享',content:'这个产品还不错，可以试试看。',score:15}, '短视频脚本':{quality:'D',title:'简单脚本',content:'展示产品，说几句推荐语。',score:12}, '短视频':{quality:'D',title:'简单视频',content:'拍产品+说推荐语。',score:10}, '纯文案':{quality:'D',title:'文案草稿',content:'产品好用，推荐购买。',score:15}, '简单任务':{quality:'D',title:'任务结果',content:'已完成基本任务。',score:10} };
  const generic = genericOutputs[taskType] || genericOutputs['简单任务'];
  return { hasSkill:false, skillUsed:null, quality:generic.quality, title:generic.title, content:generic.content, hashtags:[], score:generic.score, avatarName:avatar.name };
}

function acceptWork(id, skillUsed, quality, score) {
  const a = STATE.hiredAvatars[id] || STATE.plazaAvatars[id];
  if(!a) return;
  const msgs = document.getElementById('hiredChatMsgs');
  
  // Calculate payment
  let fee = 10;
  if(skillUsed) {
    const pricing = {S:99,A:59,B:29,C:15,D:10};
    fee = pricing[quality] || 29;
  } else {
    fee = 5; // no skill = minimal fee
  }
  
  // Add XP to avatar
  a.xp = Math.min(a.xpMax, a.xp + (skillUsed ? 30 : 10));
  checkLevelUp(id);
  
  msgs.innerHTML += `<div class="chat-msg system">
    ✅ 任务已验收完成！<br>
    ${skillUsed ? `技能：${skillUsed} · 品质：${quality}级 · 评分：${score}/100<br>` : ''}
    费用：¥${fee} · ${a.name}获得${skillUsed?30:10}XP
  </div>`;
  msgs.scrollTop = msgs.scrollHeight;
  showToast(`✅ 验收完成！支付¥${fee}`);
}

function renderSkillPanel(a) {
  const sk = SKILL_DETAILS;
  const sp = STATE.skillProgress || {};
  const ab = a.abilities || {writing:0,creativity:0,professionalism:0,engagement:0,accuracy:0};
  let html = `<div style="padding:16px">`;
  html += `<div style="font-size:14px;font-weight:700;margin-bottom:10px">🎯 ${a.name}的能力面板</div>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">`;
  const abNames = {writing:'✍️ 写作力',creativity:'🎨 创意力',professionalism:'💼 专业度',engagement:'📱 互动力',accuracy:'📊 精准度'};
  for (const [k,label] of Object.entries(abNames)) {
    const val = ab[k]||0;
    const color = val>=80?'#16a34a':val>=50?'#d97706':val>=20?'#3b82f6':'#94a3b8';
    html += `<div style="background:#f8fafc;border-radius:10px;padding:8px 10px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${label}</span><span style="color:${color};font-weight:600">${val}</span></div><div class="progress-bar" style="height:6px;margin-top:4px"><div class="progress-fill" style="width:${val}%;background:${color}"></div></div></div>`;
  }
  html += `</div>`;
  html += `<div style="display:flex;gap:8px;margin-bottom:14px"><div style="flex:1;background:#ede9fe;border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:700;color:#6d28d9">${a.skills.length}</div><div style="font-size:10px;color:#6d28d9">已掌握</div></div><div style="flex:1;background:#fef3c7;border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:700;color:#d97706">${a.learning.length}</div><div style="font-size:10px;color:#d97706">学习中</div></div><div style="flex:1;background:#f1f5f9;border-radius:10px;padding:10px;text-align:center"><div style="font-size:20px;font-weight:700;color:#64748b">${Object.keys(sk).length - a.skills.length - a.learning.length}</div><div style="font-size:10px;color:#64748b">待学习</div></div></div>`;
  if (a.learning.length > 0) {
    html += `<div style="font-size:13px;font-weight:700;margin-bottom:8px">📖 正在学习</div>`;
    a.learning.forEach(skillName => {
      const detail = sk[skillName];
      if (!detail) return;
      const prog = sp[skillName] || {step:0,total:detail.steps.length,examPassed:false,examAttempts:0};
      const pct = Math.round(prog.step / prog.total * 100);
      const currentStep = detail.steps[Math.min(prog.step, prog.total-1)];
      const canLearn = a.lv >= detail.reqLv;
      const aid = a===STATE.avatars[1]?1:a===STATE.avatars[2]?2:3;
      html += `<div style="background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)">`;
      html += `<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:600;font-size:14px">${detail.icon} ${skillName}</div><span class="lv lv${Math.min(detail.reqLv,7)}">需Lv.${detail.reqLv}</span></div>`;
      html += `<div style="font-size:12px;color:#64748b;margin-top:2px">${detail.desc}</div>`;
      html += `<div class="progress-bar" style="margin-top:8px"><div class="progress-fill pf-purple" style="width:${pct}%"></div></div>`;
      html += `<div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:2px"><span>进度 ${prog.step}/${prog.total}</span><span>${pct}%</span></div>`;
      if (prog.step < prog.total) {
        html += `<div style="background:#f3f0ff;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px">`;
        html += `<div style="font-weight:600;color:#6d28d9">📍 当前：第${prog.step+1}步 · ${currentStep.title}</div>`;
        html += `<div style="color:#64748b;margin-top:2px">${currentStep.brief||currentStep.title}</div>`;
        html += `</div>`;
      }
      html += `<div style="font-size:11px;color:#94a3b8;margin-top:6px">完成效果：${Object.entries(detail.gain).map(([k,v])=>abNames[k]+'+'+v).join(' · ')} · +${detail.xp}XP</div>`;
      if (prog.step >= prog.total && !prog.examPassed) {
        html += `<div style="display:flex;gap:8px;margin-top:8px"><button class="act-btn act-primary" style="flex:1" onclick="takeExam('${skillName}',${aid})">📝 参加考核</button><button class="act-btn act-danger" style="flex:0;padding:8px 12px" onclick="abandonSkill('${skillName}',${aid})">放弃</button></div>`;
      } else if (prog.step < prog.total) {
        html += `<div style="display:flex;gap:8px;margin-top:8px"><button class="act-btn act-primary" style="flex:1" onclick="startLearnStep('${skillName}',${aid})">📖 继续学习</button><button class="act-btn act-danger" style="flex:0;padding:8px 12px" onclick="abandonSkill('${skillName}',${aid})">放弃</button></div>`;
      }
      html += `</div>`;
    });
  }
  const availableSkills = Object.entries(sk).filter(([name]) => !a.skills.includes(name) && !a.learning.includes(name));
  if (availableSkills.length > 0) {
    html += `<div style="font-size:13px;font-weight:700;margin:8px 0">🔓 可学习技能</div>`;
    availableSkills.forEach(([name, detail]) => {
      const canLearn = a.lv >= detail.reqLv;
      const aid = a===STATE.avatars[1]?1:a===STATE.avatars[2]?2:3;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f8fafc;${canLearn?'':'opacity:0.5'}">`;
      html += `<div><div style="font-weight:600;font-size:13px">${detail.icon} ${name} ${!canLearn?'<span style="font-size:10px;color:#ef4444">🔒Lv.'+detail.reqLv+'</span>':''}</div><div style="font-size:11px;color:#64748b">${detail.desc}</div><div style="font-size:10px;color:#94a3b8;margin-top:1px">${detail.steps.length}步 · +${detail.xp}XP · ${Object.entries(detail.gain).map(([k,v])=>abNames[k]+'+'+v).join(' ')}</div></div>`;
      html += `<button class="act-btn ${canLearn?'act-primary':'act-disabled'}" style="flex:0;padding:6px 12px;font-size:11px" onclick="${canLearn?"startLearnSkill('"+name+"',"+aid+")":"showToast('需要Lv."+detail.reqLv+"')"}">学习</button>`;
      html += `</div>`;
    });
  }
  if (a.skills.length > 0) {
    html += `<div style="font-size:13px;font-weight:700;margin:8px 0">✅ 已掌握技能</div>`;
    a.skills.forEach(name => {
      const detail = sk[name];
      if (!detail) return;
      html += `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f8fafc"><span style="font-size:16px">${detail.icon}</span><div style="flex:1"><div style="font-weight:500;font-size:13px">${name}</div><div style="font-size:10px;color:#94a3b8">${Object.entries(detail.gain).map(([k,v])=>abNames[k]+'+'+v).join(' · ')}</div></div><span style="font-size:10px;color:#16a34a;font-weight:600">✓ 已掌握</span></div>`;
    });
  }
  html += `</div>`;
  return html;
}

function switchTeachTab(idx,id){document.querySelectorAll('#teachTabs .tab-item').forEach((t,i)=>{t.classList.toggle('active',i===idx)});document.querySelectorAll('#teachContent .tab-content').forEach((t,i)=>{t.classList.toggle('active',i===idx)})}
function setTeachCategory(cat,id){
  const a=STATE.avatars[id];if(!a)return;
  const input=document.getElementById('teachInput');
  const tips={writing_style:'例如：写文案时用轻松活泼的语气，多用emoji和感叹号',content_rule:'例如：种草文必须包含产品名、使用感受、推荐理由3个要素',brand_tone:'例如：保持温暖亲切的品牌调性，像闺蜜聊天一样',audience:'例如：目标读者是25-35岁都市女性，关注性价比',topic:'例如：重点关注平价好物和成分分析类话题',expression:'例如：常用表达：绝绝子、无限回购、闭眼入'};
  if(input)input.placeholder=tips[cat]||'告诉它应该怎么做...';
  showToast('教学方向：'+{writing_style:'写作风格',content_rule:'内容规范',brand_tone:'品牌调性',audience:'受众偏好',topic:'话题偏好',expression:'常用表达'}[cat]);
}
function fillTeachInput(text,id){
  const input=document.getElementById('teachInput');
  if(input){input.value=text;sendTeach(id||Object.keys(STATE.avatars)[0])}
}
function sendTeach(id){
  const input=document.getElementById('teachInput');const msg=input.value.trim();if(!msg)return;input.value='';
  const msgs=document.getElementById('teachMsgs');
  msgs.innerHTML+=`<div class="chat-msg user">${msg}</div>`;
  const a=STATE.avatars[id];
  // Analyze what user is teaching and give specific response
  let reply='好的，我记住了！以后会按这个方式来 ✅';
  if(msg.includes('语气')||msg.includes('风格'))reply='收到！我以后写内容时会注意调整语气和风格，会更贴合你的要求 ✅';
  else if(msg.includes('必须')||msg.includes('一定')||msg.includes('规范'))reply='明白了！这是硬性规则，我会严格遵守，不会遗漏 ✅';
  else if(msg.includes('不要')||msg.includes('避免')||msg.includes('禁止'))reply='记下了！这些是我要避免的雷区，绝不触碰 ✅';
  else if(msg.includes('读者')||msg.includes('受众')||msg.includes('用户'))reply='了解！我会针对这个人群的特点来调整内容和表达 ✅';
  else if(msg.includes('品牌')||msg.includes('调性'))reply='收到！我会保持品牌的一致调性，让内容更有辨识度 ✅';
  else if(msg.includes('常用')||msg.includes('口头禅')||msg.includes('表达'))reply='记住了！这些表达方式我会融入日常输出中 ✅';
  setTimeout(()=>{
    msgs.innerHTML+=`<div class="chat-msg bot">${reply}</div>`;
    // Award XP
    if(a){a.xp=Math.min(a.xpMax,a.xp+30);showToast('+30 XP')}
    msgs.scrollTop=msgs.scrollHeight;
  },500);
}
function uploadMaterial(type,id){
  const a=STATE.avatars[id];if(!a)return;
  if(!a.materials)a.materials=[];
  const typeNames={doc:'📄 文档',image:'🖼️ 图片',link:'🔗 链接',text:'📝 文本'};
  const names={doc:'品牌资料手册.pdf',image:'产品实拍图.jpg',link:'竞品分析报告',text:'品牌介绍文本'};
  const mat={id:Date.now(),type,name:names[type]||'新资料',status:'uploading',time:'刚刚',size:type==='doc'?'2.3MB':type==='image'?'1.1MB':type==='link'?'外部链接':'0.5KB'};
  a.materials.unshift(mat);
  renderTeachMaterials(id);
  simulateUpload(mat.id,id);
}
function simulateUpload(matId,id){
  const a=STATE.avatars[id];if(!a)return;
  const mat=a.materials.find(m=>m.id===matId);if(!mat)return;
  setTimeout(()=>{
    mat.status='processing';
    renderTeachMaterials(id);
  },1000);
  setTimeout(()=>{
    mat.status='parsed';
    // Extract knowledge points
    mat.extracted=['品牌定位','核心卖点','用户画像','竞品差异'];
    renderTeachMaterials(id);
    a.xp=Math.min(a.xpMax,a.xp+20);
    showToast('资料解析完成！+20 XP');
  },3000);
}
function renderTeachMaterials(id){
  const a=STATE.avatars[id];if(!a)return;
  const list=document.getElementById('materialList');
  if(!list)return;
  if(a.materials.length===0){list.innerHTML='<div style="text-align:center;padding:30px;color:#94a3b8;font-size:13px">还没有上传资料<br>上传文档/图片/链接让分身学习</div>';return}
  list.innerHTML=a.materials.map(m=>{
    const statusMap={uploading:'⏳ 上传中',processing:'🔄 解析中',parsed:'✅ 已解析'};
    const statusColor={uploading:'#3b82f6',processing:'#d97706',parsed:'#16a34a'};
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f8fafc">
      <div style="flex:1;min-width:0"><div style="font-weight:500;font-size:13px">${m.name}</div><div style="font-size:11px;color:#94a3b8">${m.size} · ${m.time}</div>
      ${m.extracted?`<div style="font-size:10px;color:#6d28d9;margin-top:2px">提取：${m.extracted.join('、')}</div>`:''}</div>
      <span style="font-size:11px;color:${statusColor[m.status]};white-space:nowrap">${statusMap[m.status]}</span>
      <button style="border:none;background:none;font-size:14px;cursor:pointer;color:#ef4444;padding:4px" onclick="deleteMaterial(${m.id},${id})">×</button>
    </div>`;
  }).join('');
}
function deleteMaterial(matId,id){
  const a=STATE.avatars[id];if(!a)return;
  a.materials=a.materials.filter(m=>m.id!==matId);
  renderTeachMaterials(id);showToast('资料已删除');
}
function submitCorrection(id){
  const a=STATE.avatars[id];if(!a)return;
  if(!a.corrections)a.corrections=[];
  const outputEl=document.getElementById('corrOutput');
  const correctEl=document.getElementById('corrCorrect');
  const output=outputEl?outputEl.value.trim():'';
  const correct=correctEl?correctEl.value.trim():'';
  if(!output||!correct){showToast('请填写分身输出和正确内容');return}
  a.corrections.unshift({id:Date.now(),output,correct,time:'刚刚'});
  if(outputEl)outputEl.value='';if(correctEl)correctEl.value='';
  renderCorrections(id);
  a.xp=Math.min(a.xpMax,a.xp+15);
  showToast('纠正已保存！分身会记住的 +15 XP');
}
function renderCorrections(id){
  const a=STATE.avatars[id];if(!a)return;

function deleteCorrection(cId,id){
  const a=STATE.avatars[id];if(!a)return;
  a.corrections=a.corrections.filter(c=>c.id!==cId);
  renderCorrections(id);showToast('纠正已删除');

function startLearnSkill(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  const detail=SKILL_DETAILS[skillName];if(!detail)return;
  if(a.lv<detail.reqLv){showToast('需要Lv.'+detail.reqLv+'才能学习');return}
  if(a.skills.includes(skillName)){showToast('已掌握此技能');return}
  if(a.learning.includes(skillName)){showToast('正在学习中');return}
  a.learning.push(skillName);
  if(!STATE.skillProgress)STATE.skillProgress={};
  STATE.skillProgress[skillName]={step:0,total:detail.steps.length,examPassed:false,examAttempts:0};
  showToast(`开始学习「${skillName}」！`);
  // Auto open first step
  startLearnStep(skillName,id);
}
function startLearnStep(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  const detail=SKILL_DETAILS[skillName];if(!detail)return;
  const prog=STATE.skillProgress?.[skillName];if(!prog)return;
  if(prog.step>=prog.total){
    // All steps done, need exam
    takeExam(skillName,id);return;

  const step=detail.steps[prog.step];
  // Show learning content in a sub-like overlay
  const el=document.getElementById('sub-dynamic');
  el.className='subpage';el.style.display='block';
  el.innerHTML=`<div class="sub-header"><button class="sub-back" onclick="closeLearnStep('${skillName}',${id})">←</button><div class="sub-title">${detail.icon} ${skillName}</div><div style="font-size:12px;color:#94a3b8">${prog.step+1}/${prog.total}</div></div>
  <div class="sub-body">
    <div style="background:#f3f0ff;border-radius:14px;padding:16px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:700;color:#6d28d9;margin-bottom:6px">📍 第${prog.step+1}步：${step.title}</div>
      <div style="font-size:12px;color:#6d28d9;margin-bottom:10px">预计学习时间：${step.time||'2分钟'}</div>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">📖 学习内容</div>
    <div style="background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.8;color:#475569">
      ${step.content.split('\n').map(line=>line.trim()?`<div style="margin-bottom:4px">${line}</div>`:'').join('')}
    </div>
    ${step.example?`<div style="font-size:14px;font-weight:600;margin-bottom:8px">💡 示例</div>
    <div style="background:#fef3c7;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6;color:#92400e">
      ${step.example.split('\n').map(line=>line.trim()?`<div style="margin-bottom:2px">${line}</div>`:'').join('')}
    </div>`:''}
    ${step.tips?`<div style="font-size:14px;font-weight:600;margin-bottom:8px">⚠️ 注意事项</div>
    <div style="background:#fef2f2;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6;color:#991b1b">
      ${step.tips.split('\n').map(line=>line.trim()?`<div style="margin-bottom:2px">${line}</div>`:'').join('')}
    </div>`:''}
    ${step.practice?`<div style="font-size:14px;font-weight:600;margin-bottom:8px">✍️ 练一练</div>
    <div style="background:#eff6ff;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6;color:#1e40af">
      ${step.practice}
    </div>
    <textarea class="form-textarea" id="practiceInput" placeholder="在这里写下你的练习..." style="margin-bottom:10px"></textarea>`:''}
    <div class="progress-bar" style="margin-bottom:6px"><div class="progress-fill pf-purple" style="width:${(prog.step+1)/prog.total*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:14px"><span>进度 ${prog.step+1}/${prog.total}</span><span>${Math.round((prog.step+1)/prog.total*100)}%</span></div>
    <button class="act-btn act-primary" style="width:100%" onclick="completeLearnStep('${skillName}',${id})">✅ 我学会了，进入下一步</button>
  </div>`;
}
function completeLearnStep(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  const prog=STATE.skillProgress?.[skillName];if(!prog)return;
  prog.step++;
  a.xp=Math.min(a.xpMax,a.xp+10);
  if(prog.step>=prog.total){
    showToast('所有步骤完成！请参加考核');
    closeLearnStep(skillName,id);
    // Re-render to show exam button
    const el=document.getElementById('sub-dynamic');
    renderSubContent(el,'teach',{id});
    setTimeout(()=>switchTeachTab(3,id),100);
  } else {
    showToast('+10 XP！进入下一步');
    startLearnStep(skillName,id);
  }
}
function closeLearnStep(skillName,id){
  const el=document.getElementById('sub-dynamic');
  el.style.display='none';el.className='subpage';
  renderSubContent(el,'teach',{id});
  setTimeout(()=>switchTeachTab(3,id),50);
}
function takeExam(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  const detail=SKILL_DETAILS[skillName];if(!detail)return;
  const prog=STATE.skillProgress?.[skillName];if(!prog)return;
  const exam=detail.exam;if(!exam)return;
  const el=document.getElementById('sub-dynamic');
  el.className='subpage';el.style.display='block';
  el.innerHTML=`<div class="sub-header"><button class="sub-back" onclick="closeLearnStep('${skillName}',${id})">←</button><div class="sub-title">📝 技能考核</div><div></div></div>
  <div class="sub-body">
    <div style="text-align:center;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;color:#fff;margin-bottom:16px">
      <div style="font-size:36px;margin-bottom:4px">${detail.icon}</div>
      <div style="font-size:17px;font-weight:700">${skillName}</div>
      <div style="font-size:12px;opacity:.8;margin-top:2px">考核通过即可掌握此技能</div>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">❓ 考核题目</div>
    <div style="background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.6">${exam.question}</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">你的答案</div>
    <textarea class="form-textarea" id="examAnswer" placeholder="请认真作答，展示你学到的知识..." style="min-height:120px;margin-bottom:14px"></textarea>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:14px">💡 评分标准：${exam.criteria}</div>
    <button class="act-btn act-primary" style="width:100%" onclick="submitExam('${skillName}',${id})">📤 提交考核</button>
    ${prog.examAttempts>0?`<div style="font-size:12px;color:#94a3b8;text-align:center;margin-top:8px">已尝试${prog.examAttempts}次</div>`:''}
  </div>`;
}
function submitExam(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  const detail=SKILL_DETAILS[skillName];if(!detail)return;
  const prog=STATE.skillProgress?.[skillName];if(!prog)return;
  const answer=document.getElementById('examAnswer');
  const ans=answer?answer.value.trim():'';
  if(ans.length<10){showToast('请认真作答，至少写10个字');return}
  prog.examAttempts=(prog.examAttempts||0)+1;
  // Check answer quality based on keywords
  const exam=detail.exam;
  const keywords=exam.keywords||[];
  const matched=keywords.filter(k=>ans.includes(k));
  const score=matched.length/keywords.length;
  if(score>=0.4||ans.length>=50){
    // PASS
    prog.examPassed=true;
    // Remove from learning, add to skills
    a.learning=a.learning.filter(s=>s!==skillName);
    if(!a.skills.includes(skillName))a.skills.push(skillName);
    // Update abilities
    if(!a.abilities)a.abilities={writing:0,creativity:0,professionalism:0,engagement:0,accuracy:0};
    for(const[k,v] of Object.entries(detail.gain)){
      a.abilities[k]=Math.min(100,(a.abilities[k]||0)+v);
    }
    // Award XP
    a.xp=Math.min(a.xpMax,a.xp+detail.xp);
    checkLevelUp(id);
    // Show success
    const el=document.getElementById('sub-dynamic');
    el.innerHTML=`<div class="sub-header"><button class="sub-back" onclick="closeLearnStep('${skillName}',${id})">←</button><div class="sub-title">🎉 考核通过</div><div></div></div>
    <div class="sub-body" style="text-align:center;padding:40px 20px">
      <div style="font-size:64px;margin-bottom:12px">${detail.icon}</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">恭喜掌握「${skillName}」</div>
      <div style="font-size:14px;color:#6d28d9;margin-bottom:16px">+${detail.xp} XP</div>
      <div style="background:#f0fdf4;border-radius:12px;padding:14px;margin-bottom:16px;text-align:left">
        <div style="font-size:13px;font-weight:600;color:#16a34a;margin-bottom:8px">能力提升</div>
        ${Object.entries(detail.gain).map(([k,v])=>{
          const names={writing:'✍️ 写作力',creativity:'🎨 创意力',professionalism:'💼 专业度',engagement:'📱 互动力',accuracy:'📊 精准度'};
          return `<div style="font-size:12px;color:#475569;padding:2px 0">${names[k]||k} +${v} → ${(a.abilities[k]||0)}</div>`;
        }).join('')}
      </div>
      <div style="background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:16px;text-align:left">
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">📊 ${a.name}当前能力</div>
        ${Object.entries({writing:'✍️ 写作力',creativity:'🎨 创意力',professionalism:'💼 专业度',engagement:'📱 互动力',accuracy:'📊 精准度'}).map(([k,label])=>{
          const val=a.abilities[k]||0;
          const color=val>=80?'#16a34a':val>=50?'#d97706':'#3b82f6';
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:11px;width:60px">${label}</span><div class="progress-bar" style="flex:1;height:8px"><div class="progress-fill" style="width:${val}%;background:${color}"></div></div><span style="font-size:11px;color:${color}">${val}</span></div>`;
        }).join('')}
      </div>
      <button class="act-btn act-primary" style="width:100%" onclick="closeLearnStep('${skillName}',${id})">完成</button>
    </div>`;
  } else {
    // FAIL
    showToast('考核未通过，请更详细地作答');
    answer.value='';
    answer.placeholder=`提示：试着包含这些关键词：${keywords.slice(0,3).join('、')}...`;
  }
}
function abandonSkill(skillName,id){
  const a=STATE.avatars[id];if(!a)return;
  a.learning=a.learning.filter(s=>s!==skillName);
  if(STATE.skillProgress)delete STATE.skillProgress[skillName];
  showToast(`已放弃「${skillName}」`);
  const el=document.getElementById('sub-dynamic');
  renderSubContent(el,'teach',{id});
  setTimeout(()=>switchTeachTab(3,id),50);
}
function checkLevelUp(id){
  const a=STATE.avatars[id];if(!a)return;
  while(a.xp>=a.xpMax&&a.lv<7){
    a.xp-=a.xpMax;a.lv++;
    const newMax={1:300,2:500,3:900,4:1500,5:2500,6:4000,7:9999};
    a.xpMax=newMax[a.lv]||9999;
    const rights=LEVEL_RIGHTS[a.lv];
    showToast(`🎉 ${a.name}升级到Lv.${a.lv} ${rights.name}！`);
  }
}

function renderOrderDetail(el, data) {
  const id = data?.id||1;
  const o = STATE.orders[id]; if(!o) return;
  const cov = calcCoverage(o.contentType, o.materials);
  const priceInfo = calcPrice(o.contentType, o.avatars, o.materials, o.exclusive, o.aiSupplement, null);
  const avatarEarn = calcAvatarEarning(o.contentType, o.avatars, o.materials, o.exclusive, o.aiSupplement, null);
  const platIncome = calcPlatformIncome(o.contentType, o.avatars, o.materials, o.exclusive, o.aiSupplement, null);
  el.innerHTML = `<div class="sub-header"><button class="sub-back" onclick="closeSub()">←</button><div class="sub-title">订单详情</div><div></div></div><div class="sub-body">
  <span class="order-type ot-${o.type}">${o.label}</span>
  <div class="order-title" style="font-size:18px">${o.title}</div>
  <div class="order-desc">${o.desc}</div>
  <div class="order-tags" style="margin-bottom:12px">
    <span class="order-tag">${o.contentType}</span><span class="order-tag">${o.exclusive?'独享':'共享'}</span>
    <span class="order-tag">AI${o.aiSupplement?'补足':'不补'}</span><span class="order-tag">截止：${o.deadline}</span>
  </div>
  <div style="font-size:14px;font-weight:600;margin-bottom:8px">📐 素材覆盖率</div>
  ${PRICING[o.contentType].dims.map(d=>{
    const have = o.materials.provided[d.name]||0;
    const need = (o.materials.total[d.name]||0);
    const pct = need>0?Math.round(have/need*100):0;
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:12px;width:60px">${d.name}</span><div class="coverage-bar" style="flex:1"><div class="coverage-filled" style="width:${pct}%"></div><div class="coverage-empty"></div></div><span style="font-size:11px;color:#94a3b8">${have}/${need}</span></div>`;
  }).join('')}
  <div style="text-align:right;font-size:13px;font-weight:600;margin-top:6px">综合覆盖率：${cov}%</div>
  <div style="font-size:14px;font-weight:600;margin:16px 0 8px">💰 价格明细</div>
  <div style="background:#f8fafc;border-radius:12px;padding:12px">
    <div class="price-row"><span class="label">内容类型</span><span class="val">${o.contentType}</span></div>

    <div class="price-row"><span class="label">分身数量</span><span class="val">${o.avatars}个</span></div>
    <div class="price-row"><span class="label">出场费小计</span><span class="val">¥${priceInfo.fee.toFixed(2)}</span></div>
    <div class="price-row"><span class="label">AI补足</span><span class="val">${o.aiSupplement?'开启':'关闭'}</span></div>
    ${o.aiSupplement?`<div class="price-row"><span class="label">生成单价</span><span class="val">¥${PRICING[o.contentType].genPrice}/套</span></div>
    <div class="price-row"><span class="label">需补足</span><span class="val">${(100-cov)}%</span></div>
    <div class="price-row"><span class="label">生成套数(${o.exclusive?'独享':'共享'})</span><span class="val">${priceInfo.genSets}套</span></div>
    <div class="price-row"><span class="label">生成费小计</span><span class="val">¥${priceInfo.genCost.toFixed(2)}</span></div>`:''}

  <div style="background:#f0fdf4;border-radius:12px;padding:12px">

    <div class="price-row"><span class="label">你的收益（${o.avatars}分身）</span><span class="val" style="color:#16a34a">¥${avatarEarn.toFixed(2)}</span></div>
  </div>
  <div style="font-size:11px;color:#94a3b8;margin-top:4px">平台收入：¥${platIncome.toFixed(2)}（出场费30% + 生成费100%）</div>

function acceptOrder(id){
  const o=STATE.orders[id];if(!o)return;
  delete STATE.orders[id];
  showToast('🎉 接单成功！分身开始工作');
  closeSub(); renderPage(STATE.currentTab);
}

function openModal(type, data) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  overlay.classList.add('show');
  switch(type) {
    case 'hire': {
      const a = STATE.plazaAvatars[data.id];
      const skillCount = (a.skills||[]).length;
      box.innerHTML = `
      <div style="font-size:17px;font-weight:700;margin-bottom:16px;text-align:center">💰 雇佣${a.name}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <img src="${a.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover" />
        <div style="flex:1"><div style="font-weight:600">${a.name} <span class="lv ${lvClass(a.lv)}">Lv.${a.lv}</span></div><div style="font-size:12px;color:#94a3b8">${a.style} · ⭐${a.stars}</div></div>
      </div>
      ${skillCount > 0 ? `<div style="background:#faf5ff;border-radius:12px;padding:10px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:600;color:#6d28d9;margin-bottom:4px">🎯 可用技能（${skillCount}个）</div>
        <div style="display:flex;flex-wrap:wrap;gap:3px">${a.skills.map(s=>{const d=SKILL_DETAILS[s];return d?`<span style="background:#ede9fe;color:#6d28d9;padding:2px 6px;border-radius:10px;font-size:10px">${d.icon} ${s}</span>`:''}).join('')}</div>
        <div style="font-size:10px;color:#6d28d9;margin-top:4px">有技能 = 高品质产出 = 更值得雇佣</div>
      </div>` : ''}
      <div style="background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:12px">
        <div class="price-row"><span class="label">出场费</span><span class="val">¥${a.price}</span></div>
        <div class="price-row"><span class="label">可接任务</span><span class="val">${skillCount > 0 ? CONTENT_TYPES.filter(ct => !!matchBestSkill(a, ct)).join('、') : '仅简单任务'}</span></div>
        <div class="price-row"><span class="label">品质保证</span><span class="val">${skillCount > 0 ? 'S/A级' : 'D级'}</span></div>
      </div>
      <div style="display:flex;gap:10px"><button class="act-btn act-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="act-btn act-primary" style="flex:1" onclick="doHire(${data.id})">确认雇佣</button></div>`;
      break;
    }
    case 'delete': {
      box.innerHTML = `
      <div style="font-size:17px;font-weight:700;margin-bottom:16px;text-align:center;color:#ef4444">确认删除</div>
      <div class="del-confirm"><h4>⚠️ 删除「${data.name}」</h4><p>删除后该分身的所有数据将无法恢复，包括已学习的技能和收益记录。</p></div>
      <div style="margin-top:12px;font-size:12px;color:#94a3b8">请输入分身名称「${data.name}」确认删除：</div>
      <input class="form-input" id="delConfirmInput" placeholder="输入分身名称" style="margin-top:8px" />
      <div style="display:flex;gap:10px;margin-top:16px"><button class="act-btn act-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="act-btn act-danger" style="flex:1" onclick="doDelete(${data.id})">确认删除</button></div>`;
      break;
    }
    case 'checkin': {
      box.innerHTML = `
      <div style="text-align:center;padding:20px">
        <div style="font-size:48px;margin-bottom:8px">🎉</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:4px">签到成功！</div>
        <div style="font-size:14px;color:#6d28d9;font-weight:600">+50 XP</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:4px">已连续签到${STATE.checkinDays}天</div>
        <div style="font-size:12px;color:#f59e0b;margin-top:8px">🔥 再签${7-STATE.checkinDays}天经验翻倍！</div>
        <button class="act-btn act-primary" style="margin-top:16px;display:inline-block;padding:8px 24px" onclick="closeModal()">好的</button>
      </div>`;
      break;
    }
    case 'plaza-toggle': {
      const a = STATE.avatars[data.id];
      // Calculate recommended price based on skills
      const skillCount = (a.skills||[]).length;
      const abilitySum = Object.values(a.abilities||{}).reduce((s,v)=>s+v,0);
      const avgAbility = abilitySum / 5;
      const basePrice = PRICING['纯文案'].minFee;
      const skillBonus = skillCount * 15;
      const abilityBonus = Math.floor(avgAbility / 10) * 5;

function togglePlaza(id){
  const a=STATE.avatars[id];if(!a)return;
  if(a.lv<3){showToast('Lv.3才能挂广场');return}
  if(a.hangPlaza){openModal('plaza-toggle',{id,action:'off'})}
  else{a.plazaPrice=a.plazaPrice||PRICING['纯文案'].minFee;openModal('plaza-toggle',{id,action:'on'})}
}
function doTogglePlaza(id, action, recPrice) {
  const a = STATE.avatars[id]; if(!a) return;
  a.hangPlaza = action === 'on';
  if(a.hangPlaza) {
    const customEl = document.getElementById('customPrice');
    a.plazaPrice = customEl ? parseInt(customEl.value) || recPrice : recPrice || PRICING['纯文案'].minFee;
    // Also sync to plaza avatar
    if(STATE.plazaAvatars[id]) STATE.plazaAvatars[id].price = a.plazaPrice;
  }
  showToast(a.hangPlaza ? `已挂到广场，出场费¥${a.plazaPrice}/次` : '已从广场下架');
  closeModal(); renderPage(STATE.currentTab);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tabbar-item,.tabbar-center').forEach(t => t.classList.remove('active'));
  const page = document.getElementById('page-' + tab);
  if (page) page.classList.add('active');
  const tabItems = document.querySelectorAll('.tabbar-item,.tabbar-center');
  const tabMap = { home: 0, avatars: 1, orders: 2, plaza: 3, profile: 4 };
  if (tabMap[tab] !== undefined && tabItems[tabMap[tab]]) tabItems[tabMap[tab]].classList.add('active');
  closeSub();
  renderPage(tab);
  STATE.currentTab = tab;
}

function openSub(page, data) {
  const el = document.getElementById('sub-dynamic');
  el.style.display = 'block';
  el.className = 'subpage active';
  renderSubContent(el, page, data);
}

function closeSub() {
  const el = document.getElementById('sub-dynamic');
  if (el) { el.style.display = 'none'; el.className = 'subpage'; }
}

function renderSubContent(el, page, data) {
  switch(page) {
    case 'teach': renderTeach(el, data); break;
    case 'hired-chat': renderHiredChat(el, data); break;
    case 'chat-pick': renderChatPick(el, data); break;
    case 'withdraw': renderWithdraw(el, data); break;
    case 'result-detail': renderResultDetail(el, data); break;
    case 'edit-avatar': renderEditAvatar(el, data); break;
    default: el.innerHTML = '<div class="sub-header"><button class="sub-back" onclick="closeSub()">←</button><div class="sub-title">页面</div><div></div></div><div class="sub-body"><p>页面未找到</p></div>';
  }
}

function renderPage(tab) {
  switch(tab) {
    case 'home': renderHome(); break;
    case 'avatars': renderAvatars(); break;
    case 'orders': renderOrders(); break;
    case 'plaza': renderPlaza(); break;
    case 'profile': renderProfile(); break;
  }
}

  <div style="font-size:13px;font-weight:600;margin-bottom:8px">设置出场费</div>
  <input type="number" value="${a.plazaPrice||30}" id="editPriceInput" style="width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:16px" />
  <button class="act-btn act-primary" style="width:100%;margin-top:12px" onclick="STATE.avatars[${id}].plazaPrice=parseInt(document.getElementById('editPriceInput').value)||30;showToast('已更新');closeSub()">保存</button>
  </div>`;
}


function showToast(msg) {
  let t = document.getElementById('toast-msg');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-msg';
    t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(() => { t.style.opacity = 0; }, 2000);
}

function toggleChip(el) {
  el.classList.toggle('active');
}

function init() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page active" id="page-home"><div id="page-home-content"></div></div>
    <div class="page" id="page-avatars"><div id="page-avatars-content"></div></div>
    <div class="page" id="page-orders"><div id="page-orders-content"></div></div>
    <div class="page" id="page-plaza"><div id="page-plaza-content"></div></div>
    <div class="page" id="page-profile"><div id="page-profile-content"></div></div>
    <div class="subpage" id="sub-dynamic"></div>
    <div class="modal-overlay" id="modal-overlay" onclick="event.target===this&&closeModal()"><div class="modal-box" id="modal-box"></div></div>
    <div class="tabbar">
      <div class="tabbar-item active" onclick="switchTab('home')"><div class="tab-icon">🏠</div><div>首页</div></div>
      <div class="tabbar-item" onclick="switchTab('avatars')"><div class="tab-icon">👤</div><div>分身</div></div>
      <div class="tabbar-center" onclick="switchTab('orders')"><div class="tabbar-center-btn">📋</div><div class="tabbar-center-text">接单</div></div>
      <div class="tabbar-item" onclick="switchTab('plaza')"><div class="tab-icon">🔥</div><div>广场</div></div>
      <div class="tabbar-item" onclick="switchTab('profile')"><div class="tab-icon">⚙️</div><div>我的</div></div>
    </div>`;
  renderPage('home');
}
init();
</script>
</body>
</html>
