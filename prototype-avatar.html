<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>莫瑞娜 - 人机共生平台原型 v5</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; background: #0a0a0a; color: #e5e5e5; font-size: 14px; min-height: 100vh; }

.top-bar { position: sticky; top: 0; z-index: 100; background: #111; border-bottom: 1px solid #222; padding: 8px 0; }
.person-tabs { display: flex; overflow-x: auto; gap: 6px; padding: 0 12px; -webkit-overflow-scrolling: touch; }
.person-tabs::-webkit-scrollbar { display: none; }
.person-tab { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: #1a1a1a; font-size: 12px; cursor: pointer; transition: all .2s; border: 1.5px solid transparent; }
.person-tab.active { border-color: var(--accent); background: var(--accent-dim); }
.person-tab .avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

.page-tabs { display: flex; overflow-x: auto; gap: 0; padding: 6px 12px 0; -webkit-overflow-scrolling: touch; }
.page-tabs::-webkit-scrollbar { display: none; }
.page-tab { flex-shrink: 0; padding: 6px 10px; font-size: 11px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .2s; }
.page-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.page { display: none; padding: 12px; max-width: 420px; margin: 0 auto; }
.page.active { display: block; }

.card { background: #161616; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #e5e5e5; }

/* 聊天 */
.chat-wrap { display: flex; flex-direction: column; gap: 12px; }
.chat-row { display: flex; gap: 8px; align-items: flex-start; }
.chat-row.right { flex-direction: row-reverse; }
.chat-av { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: #222; }
.chat-bub { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6; }
.chat-row:not(.right) .chat-bub { background: #1e1e1e; border: 1px solid #2a2a2a; }
.chat-row.right .chat-bub { background: var(--accent-dim); border: 1px solid var(--accent-border); }
.chat-name { font-size: 10px; color: #555; margin-bottom: 2px; }
.chat-row.right .chat-name { text-align: right; }
.chat-time { font-size: 10px; color: #333; text-align: center; margin: 4px 0; }

.learn-tag { display: inline-flex; align-items: center; gap: 3px; background: #0a2e0a; border: 1px solid #1a4a1a; color: #4ade80; font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }

/* 纠正框 */
.correct-box { background: #1a1600; border: 1px solid #3d3500; border-radius: 10px; padding: 10px; margin-top: 8px; }
.correct-label { font-size: 11px; color: #fbbf24; font-weight: 600; margin-bottom: 4px; }
.del { color: #f87171; text-decoration: line-through; background: #2a1010; padding: 0 3px; border-radius: 3px; }
.ins { color: #4ade80; background: #0a2e0a; padding: 0 3px; border-radius: 3px; }

/* 人格引擎四层 */
.engine-layer { border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all .2s; }
.engine-layer:hover { filter: brightness(1.1); }
.engine-layer .layer-head { display: flex; align-items: center; justify-content: space-between; }
.engine-layer .layer-icon { font-size: 18px; margin-right: 8px; }
.engine-layer .layer-title { font-size: 14px; font-weight: 700; }
.engine-layer .layer-priority { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.engine-layer .layer-desc { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 6px; line-height: 1.5; }
.engine-layer .layer-items { margin-top: 10px; display: none; }
.engine-layer.expanded .layer-items { display: block; }
.layer-item { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; line-height: 1.5; }
.layer-item .item-source { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; }

.layer-red { background: linear-gradient(135deg, #2a0a0a, #1a0505); border: 1px solid #4a1a1a; }
.layer-red .layer-priority { background: #4a1a1a; color: #f87171; }
.layer-orange { background: linear-gradient(135deg, #2a1a0a, #1a0f05); border: 1px solid #4a3a1a; }
.layer-orange .layer-priority { background: #4a3a1a; color: #fbbf24; }
.layer-blue { background: linear-gradient(135deg, #0a1a2a, #050f1a); border: 1px solid #1a3a4a; }
.layer-blue .layer-priority { background: #1a3a4a; color: #60a5fa; }
.layer-green { background: linear-gradient(135deg, #0a2a1a, #051a0f); border: 1px solid #1a4a2a; }
.layer-green .layer-priority { background: #1a4a2a; color: #4ade80; }

/* 脉冲 */
.pulse { display: inline-flex; align-items: center; gap: 4px; }
.pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-box { flex: 1; background: #161616; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #222; }
.stat-num { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 10px; color: #666; margin-top: 2px; }

/* 知识库 */
.knowledge-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); margin-bottom: 6px; }
.knowledge-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: #222; }
.knowledge-content { flex: 1; }
.knowledge-title { font-size: 12px; font-weight: 500; }
.knowledge-desc { font-size: 11px; color: #666; margin-top: 2px; }
.knowledge-source { font-size: 10px; color: #444; margin-top: 2px; }

/* 场景卡 */
.scene-card { border-radius: 12px; padding: 16px; margin-bottom: 10px; border: 1px solid; }
.scene-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.scene-desc { font-size: 12px; opacity: 0.7; line-height: 1.5; margin-bottom: 10px; }
.scene-flow { font-size: 11px; opacity: 0.6; line-height: 1.8; }

/* 关键时刻 */
.decision-card { border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #222; background: #161616; }
.decision-scenario { font-size: 12px; color: #999; margin-bottom: 6px; }
.decision-compare { display: flex; gap: 8px; }
.decision-side { flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
.decision-user { background: #0a1a0a; border: 1px solid #1a3a1a; }
.decision-clone { background: #1a0a0a; border: 1px solid #3a1a1a; }
.decision-label { font-size: 10px; font-weight: 600; margin-bottom: 4px; }
.decision-match { font-size: 11px; text-align: center; margin-top: 8px; padding: 4px; border-radius: 6px; }

.expand-btn { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 6px; display: inline-block; }

/* 技能工作流 */
.skill-card { background: #161616; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
.skill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.skill-name { font-size: 15px; font-weight: 700; }
.skill-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.workflow-step { display: flex; gap: 12px; margin-bottom: 8px; }
.step-indicator { display: flex; flex-direction: column; align-items: center; width: 24px; flex-shrink: 0; }
.step-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.step-line { width: 2px; flex: 1; background: #222; min-height: 10px; }
.step-content { flex: 1; padding-bottom: 8px; }
.step-action { font-size: 12px; font-weight: 500; color: #e5e5e5; }
.step-decision { font-size: 11px; color: #888; margin-top: 2px; line-height: 1.4; }
.step-evidence { font-size: 10px; color: #555; margin-top: 2px; }

.skill-stats { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #222; }
.skill-stat { flex: 1; text-align: center; }
.skill-stat-num { font-size: 16px; font-weight: 700; }
.skill-stat-label { font-size: 10px; color: #666; margin-top: 1px; }

/* 技能市场 */
.market-item { background: #161616; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; cursor: pointer; transition: all .2s; }
.market-item:hover { border-color: #444; }
.market-header { display: flex; gap: 10px; margin-bottom: 10px; }
.market-avatar { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.market-info { flex: 1; }
.market-skill-name { font-size: 14px; font-weight: 600; }
.market-owner { font-size: 11px; color: #888; margin-top: 2px; }
.market-price { font-size: 16px; font-weight: 700; color: #fbbf24; }
.market-price-unit { font-size: 11px; color: #888; font-weight: 400; }
.market-evidence { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.evidence-tag { font-size: 10px; padding: 3px 8px; border-radius: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #aaa; }
.evidence-tag.highlight { background: #0a2a10; border-color: #1a4a2a; color: #4ade80; }
.market-workflow-preview { font-size: 11px; color: #666; line-height: 1.6; padding: 8px; background: #111; border-radius: 8px; margin-bottom: 10px; }
.market-btn { display: inline-block; padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

/* 执行模拟 */
.exec-step { display: flex; gap: 10px; margin-bottom: 10px; animation: fadeIn .5s ease-in; }
.exec-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.exec-content { flex: 1; }
.exec-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.exec-detail { font-size: 11px; color: #999; line-height: 1.5; }
.exec-result { background: #111; border-radius: 8px; padding: 10px; margin-top: 6px; font-size: 12px; line-height: 1.6; }
.exec-option { padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; }
.exec-option.best { background: #0a2a10; border: 1px solid #1a4a2a; }
.exec-option.discarded { background: #1a1a1a; color: #666; text-decoration: line-through; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* 收入 */
.income-overview { background: linear-gradient(135deg, #1a1a0a, #0f0f05); border-radius: 14px; padding: 20px; margin-bottom: 12px; border: 1px solid #2a2a0a; text-align: center; }
.income-total { font-size: 36px; font-weight: 800; color: #fbbf24; }
.income-total-unit { font-size: 14px; color: #888; font-weight: 400; }
.income-sub { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
.income-sub-item { text-align: center; }
.income-sub-num { font-size: 18px; font-weight: 700; color: #e5e5e5; }
.income-sub-label { font-size: 10px; color: #666; }

.income-record { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
.income-record:last-child { border-bottom: none; }
.income-record-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.income-record-info { flex: 1; }
.income-record-title { font-size: 12px; font-weight: 500; }
.income-record-time { font-size: 10px; color: #555; margin-top: 2px; }
.income-record-amount { font-size: 14px; font-weight: 700; color: #4ade80; text-align: right; }
.income-record-source { font-size: 10px; color: #555; text-align: right; }

/* 社会价值 */
.impact-card { border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #161616; border: 1px solid #222; }
.impact-number { font-size: 24px; font-weight: 800; margin-bottom: 2px; }
.impact-label { font-size: 11px; color: #888; }
.impact-story { background: #111; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 11px; line-height: 1.6; color: #aaa; border-left: 3px solid; }

/* 进化曲线 */
.curve-container { background: #111; border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
.curve-bar { display: flex; align-items: flex-end; gap: 4px; height: 100px; margin-bottom: 8px; }
.curve-col { flex: 1; border-radius: 4px 4px 0 0; transition: height .5s; position: relative; }
.curve-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #555; white-space: nowrap; }
.curve-value { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #999; white-space: nowrap; }
</style>
</head>

  document.documentElement.style.setProperty('--accent-dim', d.accentDim);
  document.documentElement.style.setProperty('--accent-border', d.accentBorder);
}

function renderAll() {
  const d = p();
  setAccent(d);
  renderPersonTabs();
  renderPage1();
  renderPage2();
  renderPage3();
  renderPage4();
  renderPage5();
  renderPage6();
  renderPage7();
  renderPage8();
}

function renderPersonTabs() {
  const el = document.getElementById('personTabs');
  el.innerHTML = Object.entries(persons).map(([k, p]) =>
    `<div class="person-tab ${k === currentPerson ? 'active' : ''}" data-person="${k}">
      <div class="avatar" style="background:${p.accent}20">${p.emoji}</div>
      <span style="color:${k === currentPerson ? p.accent : '#666'}">${p.name}</span>
    </div>`
  ).join('');
}

function toggleLayer(el) {
  el.classList.toggle('expanded');
  const btn = el.querySelector('.expand-btn');
  btn.textContent = el.classList.contains('expanded') ? '收起 ↑' : '点击展开 →';
}

// ===== 页面切换逻辑 =====
document.getElementById('pageTabs').addEventListener('click', e => {
  const tab = e.target.closest('.page-tab');
  if (!tab) return;
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page' + tab.dataset.page);
  if (page) page.classList.add('active');
});

document.getElementById('personTabs').addEventListener('click', e => {
  const tab = e.target.closest('.person-tab');
  if (!tab) return;
  currentPerson = tab.dataset.person;
  renderAll();
});

renderAll();
