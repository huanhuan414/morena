<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人机共生平台 · 分身进化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f8; color: #1e293b; overflow-x: hidden; }

/* 手机壳 */
.phone-frame { width: 390px; height: 844px; margin: 20px auto; border-radius: 44px; overflow: hidden; background: #f5f5f8; box-shadow: 0 20px 60px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; }

/* 顶部渐变 Header */
.page-header { position: relative; width: 100%; padding: 0 20px 16px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%); flex-shrink: 0; border-radius: 0 0 28px 28px; }
.header-decoration { position: absolute; top: 0; right: 0; width: 140px; height: 100%; overflow: hidden; pointer-events: none; }
.decoration-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1); }
.circle-1 { width: 80px; height: 80px; top: -20px; right: -15px; }
.circle-2 { width: 56px; height: 56px; top: 30px; right: 40px; }
.header-title { color: #fff; font-size: 18px; font-weight: 700; padding: 52px 0 4px; letter-spacing: 0.5px; }
.header-subtitle { color: rgba(255,255,255,0.7); font-size: 12px; }

/* 底部导航 */
.bottom-tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; z-index: 50; padding-bottom: 8px; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: all 0.2s; }
.tab-icon { font-size: 20px; color: #94a3b8; transition: color 0.2s; }
.tab-label { font-size: 10px; color: #94a3b8; font-weight: 500; transition: color 0.2s; }
.tab-item.active .tab-icon { color: #6366f1; }
.tab-item.active .tab-label { color: #6366f1; font-weight: 600; }

/* 内容区 */
.content-area { flex: 1; overflow-y: auto; padding-bottom: 72px; }
.content-area::-webkit-scrollbar { width: 0; }

/* 页面通用 */
.page-content { padding: 16px 20px 20px; display: none; }
.page-content.active { display: block; }

/* 分身切换 */
.avatar-switcher { display: flex; gap: 12px; padding: 12px 0; overflow-x: auto; }
.avatar-switcher::-webkit-scrollbar { height: 0; }
.avatar-chip { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 24px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; flex-shrink: 0; border: 2px solid transparent; transition: all 0.2s; }
.avatar-chip.active { border-color: #6366f1; background: rgba(99,102,241,0.06); }
.avatar-chip-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.avatar-chip-name { font-size: 13px; font-weight: 600; color: #1e293b; }
.avatar-chip-role { font-size: 10px; color: #94a3b8; }
.avatar-chip.active .avatar-chip-name { color: #6366f1; }

/* 卡片 */
.card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.04); margin-bottom: 16px; }
.card-header { padding: 16px 18px 10px; display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 15px; font-weight: 700; color: #1e293b; }
.card-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.card-body { padding: 0 18px 16px; }

/* 聊天气泡 */
.chat-container { padding: 0 18px 16px; }
.chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
.chat-bubble.user { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
.chat-bubble.avatar { background: #f1f5f9; color: #334155; border-bottom-left-radius: 4px; }
.chat-learn-tag { display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.chat-learn-tag.bottom-line { background: rgba(239,68,68,0.1); color: #ef4444; }
.chat-learn-tag.style { background: rgba(99,102,241,0.1); color: #6366f1; }
.chat-learn-tag.judgment { background: rgba(245,158,11,0.1); color: #f59e0b; }
.chat-learn-tag.knowledge { background: rgba(16,185,129,0.1); color: #10b981; }
.chat-avatar-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 10px; }
.chat-avatar-img { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
.chat-input-bar { display: flex; gap: 8px; padding: 10px 18px 14px; background: #fff; border-top: 1px solid #f1f5f9; }
.chat-input { flex: 1; height: 36px; border-radius: 18px; border: 1px solid #e2e8f0; padding: 0 14px; font-size: 13px; outline: none; background: #f8fafc; }
.chat-send-btn { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }

/* 群聊 */
.group-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
.group-item:last-child { border-bottom: none; }
.group-avatar { width: 44px; height: 44px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.group-info { flex: 1; }
.group-name { font-size: 14px; font-weight: 600; color: #1e293b; }
.group-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.group-status { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
.group-status.on { background: rgba(16,185,129,0.1); color: #10b981; }
.group-status.off { background: #f1f5f9; color: #94a3b8; }

/* 纠正框 */
.correct-box { margin: 8px 0; padding: 10px 14px; border-radius: 12px; border: 1px dashed #f59e0b; background: rgba(245,158,11,0.04); }
.correct-label { font-size: 11px; color: #f59e0b; font-weight: 600; margin-bottom: 6px; }
.correct-old { font-size: 12px; color: #94a3b8; text-decoration: line-through; }
.correct-new { font-size: 12px; color: #1e293b; font-weight: 500; margin-top: 4px; }
.correct-diff { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(99,102,241,0.06); font-size: 11px; color: #6366f1; font-weight: 500; }

/* 关键时刻 */
.scene-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
.scene-title { font-size: 14px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
.scene-compare { display: flex; gap: 10px; }
.scene-col { flex: 1; }
.scene-label { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
.scene-label.me { color: #6366f1; }
.scene-label.av { color: #8b5cf6; }
.scene-text { font-size: 12px; line-height: 1.6; color: #475569; padding: 10px; border-radius: 10px; background: #f8fafc; }
.scene-match { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.scene-match-bar { flex: 1; height: 6px; border-radius: 3px; background: #f1f5f9; overflow: hidden; }
.scene-match-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }
.scene-match-text { font-size: 11px; font-weight: 700; min-width: 36px; text-align: right; }

/* 进化曲线 */
.evolution-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
.evolution-title { font-size: 14px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
.evolution-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; padding: 0 4px; }
.evo-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.4s; }
.evo-labels { display: flex; gap: 4px; padding: 4px 4px 0; }
.evo-label { flex: 1; text-align: center; font-size: 9px; color: #94a3b8; }

/* 人格引擎四层 */
.engine-layer { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s; }
.engine-layer:last-child { border-bottom: none; }
.engine-layer:hover { background: #f8fafc; }
.engine-layer-header { display: flex; align-items: center; gap: 10px; }
.engine-layer-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.engine-layer-name { font-size: 14px; font-weight: 700; color: #1e293b; }
.engine-layer-desc { font-size: 11px; color: #94a3b8; margin-top: 1px; }
.engine-layer-priority { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.engine-layer-detail { display: none; padding: 12px 0 4px 42px; }
.engine-layer.expanded .engine-layer-detail { display: block; }
.engine-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.engine-item-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.engine-item-text { font-size: 12px; color: #475569; line-height: 1.5; }
.engine-item-source { font-size: 10px; color: #94a3b8; margin-top: 2px; }

/* 技能卡片 */
.skill-card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.04); margin-bottom: 16px; }
.skill-cover { position: relative; height: 100px; overflow: hidden; }
.skill-cover-bg { width: 100%; height: 100%; }
.skill-cover-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%); }
.skill-cover-title { position: absolute; bottom: 12px; left: 16px; color: #fff; font-size: 16px; font-weight: 700; }
.skill-cover-badge { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 600; color: #fff; }
.skill-body { padding: 14px 16px; }
.skill-meta { display: flex; gap: 16px; margin-bottom: 12px; }
.skill-meta-item { display: flex; flex-direction: column; }
.skill-meta-value { font-size: 16px; font-weight: 700; color: #1e293b; }
.skill-meta-label { font-size: 10px; color: #94a3b8; }
.workflow-steps { display: flex; flex-direction: column; gap: 0; }
.workflow-step { display: flex; align-items: flex-start; gap: 10px; position: relative; }
.workflow-step-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; z-index: 1; }
.workflow-step-line { position: absolute; left: 9px; top: 20px; width: 2px; height: calc(100% + 4px); }
.workflow-step-content { flex: 1; padding-bottom: 14px; }
.workflow-step-title { font-size: 13px; font-weight: 600; color: #1e293b; }
.workflow-step-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
.workflow-step-evidence { font-size: 10px; color: #94a3b8; margin-top: 3px; }

/* 技能市场 */
.market-card { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 14px; }
.market-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
.market-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.market-name { font-size: 14px; font-weight: 700; color: #1e293b; }
.market-skill { font-size: 12px; color: #6366f1; font-weight: 500; }
.market-stats { display: flex; gap: 12px; padding: 0 16px 10px; }
.market-stat { font-size: 11px; color: #94a3b8; }
.market-stat b { color: #1e293b; font-weight: 600; }
.market-price { padding: 0 16px 14px; display: flex; align-items: center; justify-content: space-between; }
.market-price-val { font-size: 20px; font-weight: 700; color: #f59e0b; }
.market-price-unit { font-size: 11px; color: #94a3b8; }
.market-hire-btn { padding: 8px 20px; border-radius: 20px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }

/* 执行模拟 */
.execution-panel { background: #f8fafc; border-radius: 14px; padding: 14px; margin: 10px 16px 16px; border: 1px solid #e2e8f0; }
.exec-step { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.exec-step:last-child { margin-bottom: 0; }
.exec-step-num { width: 18px; height: 18px; border-radius: 50%; background: #6366f1; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.exec-step-num.warn { background: #f59e0b; }
.exec-step-num.danger { background: #ef4444; }
.exec-step-content { font-size: 12px; color: #475569; line-height: 1.5; }
.exec-step-content b { color: #1e293b; }
.exec-step-content .reject { color: #ef4444; text-decoration: line-through; }
.exec-step-content .recommend { color: #10b981; font-weight: 600; }

/* 收入页 */
.income-overview { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-radius: 22px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(245,158,11,0.15); }
.income-total { font-size: 32px; font-weight: 700; color: #d97706; }
.income-total-label { font-size: 12px; color: #92400e; margin-bottom: 4px; }
.income-row { display: flex; gap: 12px; margin-top: 12px; }
.income-stat { flex: 1; text-align: center; }
.income-stat-val { font-size: 16px; font-weight: 700; color: #78350f; }
.income-stat-label { font-size: 10px; color: #a16207; }
.income-divider { width: 1px; background: rgba(217,119,6,0.2); }
.income-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
.income-item-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.income-item-info { flex: 1; }
.income-item-title { font-size: 13px; font-weight: 600; color: #1e293b; }
.income-item-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.income-item-amount { font-size: 15px; font-weight: 700; color: #10b981; }

/* 社会价值 */
.value-card { background: linear-gradient(135deg, rgba(99,102,241,0.04) 0%, rgba(168,85,247,0.04) 100%); border-radius: 14px; padding: 14px; margin-top: 12px; border: 1px solid rgba(99,102,241,0.08); }
.value-stat-row { display: flex; gap: 10px; margin-bottom: 12px; }
.value-stat { flex: 1; text-align: center; padding: 8px; background: #fff; border-radius: 10px; }
.value-stat-val { font-size: 18px; font-weight: 700; color: #6366f1; }
.value-stat-label { font-size: 10px; color: #94a3b8; }
.value-story { font-size: 12px; color: #475569; line-height: 1.7; padding: 10px; background: #fff; border-radius: 10px; }

/* 知识库 */
.knowledge-section { margin-bottom: 16px; }
.knowledge-section-title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.knowledge-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f8fafc; border-radius: 12px; margin-bottom: 6px; }
.knowledge-item-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.knowledge-item-content { flex: 1; }
.knowledge-item-title { font-size: 12px; font-weight: 600; color: #1e293b; }
.knowledge-item-desc { font-size: 10px; color: #94a3b8; }
.knowledge-add-btn { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px; border: 2px dashed #e2e8f0; border-radius: 12px; color: #94a3b8; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.knowledge-add-btn:hover { border-color: #6366f1; color: #6366f1; }
.knowledge-note { font-size: 11px; color: #94a3b8; line-height: 1.6; padding: 10px 12px; background: rgba(245,158,11,0.04); border-radius: 10px; border: 1px solid rgba(245,158,11,0.1); margin-top: 8px; }

/* 分身详情顶卡 */
.profile-card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.04); margin-bottom: 16px; }
.profile-cover { position: relative; height: 80px; overflow: hidden; }
.profile-cover-bg { width: 100%; height: 100%; }
.profile-cover-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 100%); }
.profile-info-row { display: flex; align-items: flex-end; gap: 12px; padding: 0 16px; margin-top: -24px; position: relative; z-index: 2; }
.profile-avatar-img { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); object-fit: cover; }
.profile-name { font-size: 16px; font-weight: 700; color: #1e293b; }
.profile-tags { display: flex; gap: 6px; padding: 10px 16px 14px; flex-wrap: wrap; }
.profile-tag { padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 600; }

/* 三层变现 */
.monetize-layer { padding: 14px; border-radius: 14px; margin-bottom: 10px; }
.monetize-layer-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.monetize-layer-desc { font-size: 11px; line-height: 1.5; opacity: 0.8; }
.monetize-layer-income { font-size: 12px; font-weight: 700; margin-top: 6px; opacity: 0.9; }

/* 动画 */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 顶部Header -->
  <div class="page-header">
    <div class="header-decoration">
      <div class="decoration-circle circle-1"></div>
      <div class="decoration-circle circle-2"></div>
    </div>
    <div class="header-title" id="headerTitle">和分身聊天</div>
    <div class="header-subtitle" id="headerSubtitle">聊着聊着，它就越来越像你了</div>
  </div>

  <!-- 内容区 -->
  <div class="content-area">

    <!-- 页面1：和分身聊天 -->
    <div class="page-content active" id="page-chat">
      <div class="avatar-switcher" id="chatAvatarSwitcher"></div>
      <div class="profile-card">
        <div class="profile-cover">
          <div class="profile-cover-bg" id="chatCoverBg" style="background:linear-gradient(135deg,#6366f1,#a855f7)"></div>
          <div class="profile-cover-overlay"></div>
        </div>
        <div class="profile-info-row">
          <img class="profile-avatar-img" id="chatAvatarImg" src="" alt="">
          <div>
            <div class="profile-name" id="chatAvatarName">林姐</div>
          </div>
        </div>
        <div class="profile-tags" id="chatAvatarTags"></div>
      </div>
      <div class="chat-container" id="chatBubbles"></div>
      <div class="chat-input-bar">
        <input class="chat-input" placeholder="跟分身聊天，它会偷学你..." id="chatInput">
        <button class="chat-send-btn" onclick="sendChat()">↑</button>
      </div>
    </div>

    <!-- 页面2：替你回消息 -->
    <div class="page-content" id="page-group">
      <div class="avatar-switcher" id="groupAvatarSwitcher"></div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">已接入的群</div>
          <div class="card-badge" style="background:rgba(99,102,241,0.1);color:#6366f1">+ 接入</div>
        </div>
        <div id="groupList"></div>
      </div>
      <div class="card" id="groupChatCard" style="display:none">
        <div class="card-header">
          <div class="card-title" id="groupChatName">群聊</div>
          <div class="card-badge" style="background:rgba(16,185,129,0.1);color:#10b981">值守中</div>
        </div>
        <div class="chat-container" id="groupBubbles"></div>
      </div>
    </div>

    <!-- 页面3：关键时刻 -->
    <div class="page-content" id="page-critical">
      <div class="avatar-switcher" id="criticalAvatarSwitcher"></div>
      <div class="evolution-card">
        <div class="evolution-title">进化曲线：分身匹配度</div>
        <div class="evolution-chart" id="evoChart"></div>
        <div class="evo-labels" id="evoLabels"></div>
      </div>
      <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px">关键时刻测试</div>
      <div id="sceneCards"></div>
    </div>

    <!-- 页面4：人格引擎 -->
    <div class="page-content" id="page-engine">
      <div class="avatar-switcher" id="engineAvatarSwitcher"></div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px;line-height:1.6">人格引擎四层架构，优先级从高到低。点击每层展开详情。</div>
      <div class="card">
        <div id="engineLayers"></div>
      </div>
    </div>

    <!-- 页面5：技能提炼 -->
    <div class="page-content" id="page-skill">
      <div class="avatar-switcher" id="skillAvatarSwitcher"></div>
      <div id="skillCards"></div>
    </div>

  group: { title: '替你回消息', subtitle: '分身在群里用你的方式回复', tab: 1 },

function switchPage(pageId, tabIdx) {
  document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  document.querySelectorAll('.tab-item').forEach((t, i) => { t.classList.toggle('active', i === tabIdx); });
  const cfg = PAGE_CONFIG[pageId];
  document.getElementById('headerTitle').textContent = cfg.title;
  document.getElementById('headerSubtitle').textContent = cfg.subtitle;
}

// ========== 分身切换 ==========
function renderAvatarSwitcher(containerId) {
  const c = document.getElementById(containerId);
  c.innerHTML = Object.values(AVATARS).map(a => `
    <div class="avatar-chip ${a.id === currentAvatar ? 'active' : ''}" onclick="switchAvatar('${a.id}')">
      <div class="avatar-chip-img" style="background:${a.gradient};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700">${a.name[0]}</div>
      <div><div class="avatar-chip-name">${a.name}</div><div class="avatar-chip-role">${a.role.split('·')[0]}</div></div>
    </div>
  `).join('');
}

function switchAvatar(id) {
  currentAvatar = id;
  renderAll();
}

function renderAll() {
  ['chatAvatarSwitcher','groupAvatarSwitcher','criticalAvatarSwitcher','engineAvatarSwitcher','skillAvatarSwitcher','knowledgeAvatarSwitcher'].forEach(renderAvatarSwitcher);
  renderChat(); renderGroups(); renderCritical(); renderEngine(); renderSkills(); renderMarket(); renderKnowledge(); renderIncome();
}

// ========== 页面1：聊天 ==========
function renderChat() {
  const a = AVATARS[currentAvatar];
  document.getElementById('chatCoverBg').style.background = a.gradient;
  document.getElementById('chatAvatarImg').style.background = a.gradient;
  document.getElementById('chatAvatarImg').style.display = 'flex';
  document.getElementById('chatAvatarName').textContent = a.name;
  document.getElementById('chatAvatarTags').innerHTML = a.tags.map(t => `<span class="profile-tag" style="background:rgba(99,102,241,0.08);color:#6366f1">${t}</span>`).join('');
  
  const bubbles = document.getElementById('chatBubbles');
  bubbles.innerHTML = a.chats.map(c => {
    if (c.from === 'user') {
      return `<div class="chat-bubble user">${c.text}</div>`;
    } else {
      const tagHtml = c.tag ? `<div class="chat-learn-tag ${c.tag.type}">${c.tag.text}</div>` : '';
      return `<div class="chat-avatar-row"><div class="chat-avatar-img" style="background:${a.gradient};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700">${a.name[0]}</div><div><div class="chat-bubble avatar">${c.text}</div>${tagHtml}</div></div>`;
    }
  }).join('');
}

function sendChat() {
  const input = document.getElementById('chatInput');
  if (!input.value.trim()) return;
  const a = AVATARS[currentAvatar];
  a.chats.push({ from: 'user', text: input.value });
  a.chats.push({ from: 'avatar', text: '我在学习你的表达方式...', tag: { text: '风格学习', type: 'style' } });
  input.value = '';
  renderChat();
  const bubbles = document.getElementById('chatBubbles');
  bubbles.scrollTop = bubbles.scrollHeight;
}

// ========== 页面2：群聊 ==========
function renderGroups() {
  const a = AVATARS[currentAvatar];
  const list = document.getElementById('groupList');
  list.innerHTML = a.groups.map((g, i) => `
    <div class="group-item" onclick="openGroupChat(${i})">
      <div class="group-avatar">${g.name[0]}</div>
      <div class="group-info"><div class="group-name">${g.name}</div><div class="group-desc">${g.desc}</div></div>
      <div class="group-status ${g.on ? 'on' : 'off'}">${g.on ? '值守中' : '未开启'}</div>
    </div>
  `).join('');
  if (a.groups.length === 0) {
    list.innerHTML = '<div style=\"padding:40px;text-align:center;color:#94a3b8;font-size:13px\">暂未接入群聊<br><span style=\"font-size:11px\">需先对接企业微信</span></div>';
  }
}

function openGroupChat(idx) {
  const a = AVATARS[currentAvatar];
  const g = a.groups[idx];
  if (!g.msgs.length) return;
  const card = document.getElementById('groupChatCard');
  card.style.display = 'block';
  document.getElementById('groupChatName').textContent = g.name;
  const bubbles = document.getElementById('groupBubbles');
  bubbles.innerHTML = g.msgs.map(m => {
    if (m.from === 'avatar') {
      let correctHtml = '';
      if (m.correct) {
        correctHtml = `<div class="correct-box"><div class="correct-label">✏️ 你纠正了分身</div><div class="correct-old">${m.correct.old}</div><div class="correct-new">${m.correct.new}</div><div class="correct-diff">🧠 ${m.correct.diff}</div></div>`;
      }
      return `<div class="chat-avatar-row"><div class="chat-avatar-img" style="background:${a.gradient};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700">${a.name[0]}</div><div><div class="chat-bubble avatar">${m.text}</div>${correctHtml}</div></div>`;
    }
    return `<div class="chat-bubble user" style="background:#e2e8f0;color:#1e293b">${m.name}: ${m.text}</div>`;
  }).join('');
}

// ========== 页面3：关键时刻 ==========
function renderCritical() {
  const a = AVATARS[currentAvatar];
  // 进化曲线
  const chart = document.getElementById('evoChart');
  const labels = document.getElementById('evoLabels');
  const weeks = a.evolution;
  chart.innerHTML = weeks.map((v, i) => {
    const color = v < 40 ? '#ef4444' : v < 70 ? '#f59e0b' : '#10b981';
    return `<div class="evo-bar" style="height:${v}%;background:${color}"></div>`;
  }).join('');
  labels.innerHTML = weeks.map((v, i) => `<div class="evo-label">W${i+1}</div>`).join('');
  
  // 场景卡
  const cards = document.getElementById('sceneCards');
  cards.innerHTML = a.scenes.map(s => `
    <div class="scene-card">
      <div class="scene-title">${s.title}</div>
      <div class="scene-compare">
        <div class="scene-col"><div class="scene-label me">👤 我的做法</div><div class="scene-text">${s.me}</div></div>
        <div class="scene-col"><div class="scene-label av">🤖 分身做法</div><div class="scene-text">${s.avatar}</div></div>
      </div>
      <div class="scene-match">

        <div class="scene-match-text" style="color:${s.color}">${s.match}%</div>
      </div>
    </div>
  `).join('');
}
