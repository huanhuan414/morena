<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>莫瑞娜 - 人机共生平台原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; background: #f5f5f5; color: #333; }

/* 顶部导航 */
.top-nav { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: center; z-index: 100; }
.top-nav .back { position: absolute; left: 12px; font-size: 14px; color: #1890ff; cursor: pointer; }
.top-nav .title { font-size: 16px; font-weight: 600; }

/* 人物切换栏 */
.person-switcher { position: fixed; top: 44px; left: 0; right: 0; height: 72px; background: #fff; z-index: 99; border-bottom: 1px solid #eee; display: flex; padding: 8px 12px; gap: 10px; overflow-x: auto; white-space: nowrap; }
.person-switcher::-webkit-scrollbar { display: none; }
.person-card { flex: 0 0 auto; width: 90px; height: 56px; border-radius: 12px; padding: 6px 8px; cursor: pointer; transition: all .2s; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.person-card.active { border-color: #1890ff; background: #e6f7ff; }
.person-card .person-emoji { font-size: 20px; margin-bottom: 2px; }
.person-card .person-name { font-size: 10px; color: #666; font-weight: 500; }
.person-card.active .person-name { color: #1890ff; }
.person-card .person-job { font-size: 9px; color: #999; }
.person-card.active .person-job { color: #1890ff; }

/* 页面切换 */
.page-tabs { position: fixed; top: 116px; left: 0; right: 0; height: 38px; background: #fff; display: flex; z-index: 98; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
.page-tabs::-webkit-scrollbar { display: none; }
.page-tab { flex: 0 0 auto; padding: 0 12px; height: 38px; line-height: 38px; font-size: 12px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
.page-tab.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }

/* 内容区 */
.content { margin-top: 154px; padding-bottom: 80px; min-height: calc(100vh - 154px); }
.page { display: none; }
.page.active { display: block; }

/* ========== 页面0：分身主页 ========== */
.avatar-header { padding: 24px 16px 32px; color: #fff; position: relative; }
.avatar-header .avatar-circle { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 10px; border: 3px solid rgba(255,255,255,0.5); }
.avatar-header .avatar-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.avatar-header .avatar-desc { font-size: 12px; opacity: 0.85; line-height: 1.5; }
.avatar-header .similarity-badge { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }

.skill-cards { padding: 0 12px; margin-top: -16px; }
.skill-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.skill-card .skill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.skill-card .skill-name { font-size: 14px; font-weight: 600; }
.skill-card .skill-level { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.skill-card .skill-bar { height: 5px; background: #f0f0f0; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.skill-card .skill-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
.skill-card .skill-desc { font-size: 11px; color: #999; line-height: 1.4; }
.skill-card .skill-case-count { font-size: 10px; color: #bbb; margin-top: 3px; }

.quick-actions { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick-action { background: #fff; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; transition: transform .2s; }
.quick-action:active { transform: scale(0.97); }
.quick-action .action-icon { font-size: 24px; margin-bottom: 4px; }
.quick-action .action-label { font-size: 12px; font-weight: 500; }
.quick-action .action-sub { font-size: 10px; color: #999; margin-top: 2px; }

.pending-questions { padding: 0 12px; margin-top: 6px; }
.pending-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.pending-title .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4d4f; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.question-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 3px solid #1890ff; }
.question-card .q-context { font-size: 10px; color: #999; margin-bottom: 3px; }
.question-card .q-text { font-size: 13px; line-height: 1.5; color: #333; }
.question-card .q-time { font-size: 10px; color: #ccc; margin-top: 4px; }
.question-card .q-btns { display: flex; gap: 8px; margin-top: 8px; }
.question-card .q-btn { flex: 1; height: 30px; border-radius: 15px; border: none; font-size: 12px; cursor: pointer; }
.question-card .q-btn.primary { background: #1890ff; color: #fff; }
.question-card .q-btn.secondary { background: #f5f5f5; color: #666; }

/* ========== 页面1：分身对话 ========== */
.chat-header { background: #fff; padding: 10px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
.chat-header .chat-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }
.chat-header .chat-info .chat-name { font-size: 14px; font-weight: 600; }
.chat-header .chat-info .chat-status { font-size: 10px; color: #52c41a; }
.chat-mode-tabs { display: flex; padding: 6px 16px; gap: 6px; background: #fff; border-bottom: 1px solid #f0f0f0; }
.chat-mode-tab { padding: 4px 10px; border-radius: 14px; font-size: 11px; background: #f5f5f5; color: #666; cursor: pointer; }
.chat-mode-tab.active { background: #e6f7ff; color: #1890ff; }

.chat-body { padding: 14px; min-height: 350px; }
.msg { margin-bottom: 12px; display: flex; gap: 8px; }
.msg.user { flex-direction: row-reverse; }
.msg .msg-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.msg .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.6; }
.msg.ai .msg-bubble { background: #fff; border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.msg.user .msg-bubble { color: #fff; border-top-right-radius: 4px; }
.msg .msg-learning { margin-top: 4px; padding: 4px 8px; background: #f6ffed; border-radius: 6px; font-size: 10px; color: #52c41a; border: 1px solid #b7eb8f; }

.chat-input { position: fixed; bottom: 56px; left: 0; right: 0; background: #fff; padding: 8px 16px; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: flex-end; z-index: 99; }
.chat-input input { flex: 1; height: 32px; border-radius: 16px; border: 1px solid #ddd; padding: 0 12px; font-size: 13px; outline: none; }
.chat-input input:focus { border-color: #1890ff; }
.chat-input .send-btn { width: 32px; height: 32px; border-radius: 50%; border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* ========== 页面2：案例投喂 ========== */
.feed-tabs { display: flex; padding: 10px 16px; gap: 6px; }
.feed-tab { flex: 1; height: 32px; border-radius: 16px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
.feed-tab.active { border-color: #1890ff; background: #e6f7ff; color: #1890ff; }

.feed-story-area { padding: 0 12px; }
.feed-prompt { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.feed-prompt .prompt-label { font-size: 12px; color: #999; margin-bottom: 6px; }
.feed-prompt .prompt-text { width: 100%; min-height: 100px; border: none; font-size: 13px; line-height: 1.6; resize: none; outline: none; color: #333; }
.feed-prompt .prompt-hint { font-size: 10px; color: #bbb; margin-top: 6px; line-height: 1.5; }

.feed-extracted { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.feed-extracted .ext-title { font-size: 12px; font-weight: 600; color: #1890ff; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.feed-extracted .ext-item { padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.feed-extracted .ext-item:last-child { border-bottom: none; }
.feed-extracted .ext-label { font-size: 10px; color: #999; margin-bottom: 2px; }
.feed-extracted .ext-value { font-size: 12px; color: #333; line-height: 1.5; }

.feed-confirm-btn { margin: 0 12px; width: calc(100% - 24px); height: 40px; border-radius: 20px; color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }

.case-list { padding: 0 12px; margin-top: 10px; }
.case-item { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.case-item .case-skill { font-size: 10px; padding: 2px 6px; border-radius: 8px; display: inline-block; margin-bottom: 4px; }
.case-item .case-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; line-height: 1.4; }
.case-item .case-preview { font-size: 11px; color: #999; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.case-item .case-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: #ccc; }

/* ========== 页面3：镜像测试 ========== */
.mirror-intro { padding: 16px; text-align: center; }
.mirror-intro .mirror-icon { font-size: 40px; margin-bottom: 8px; }
.mirror-intro .mirror-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.mirror-intro .mirror-desc { font-size: 12px; color: #999; line-height: 1.5; }

.mirror-question { padding: 0 12px; margin-bottom: 12px; }
.mirror-q-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.mirror-q-card .q-label { font-size: 10px; color: #1890ff; font-weight: 600; margin-bottom: 6px; }
.mirror-q-card .q-scenario { font-size: 14px; line-height: 1.6; font-weight: 500; }

.mirror-compare { padding: 0 12px; }
.mirror-answer { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: relative; }
.mirror-answer .answer-label { font-size: 11px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.mirror-answer .answer-text { font-size: 13px; line-height: 1.6; color: #333; }
.mirror-answer .answer-tag { position: absolute; top: 10px; right: 10px; font-size: 10px; padding: 2px 6px; border-radius: 8px; }

.mirror-diff { background: #fffbe6; border-radius: 12px; padding: 12px; margin: 0 12px 10px; border: 1px solid #ffe58f; }
.mirror-diff .diff-title { font-size: 12px; font-weight: 600; color: #d48806; margin-bottom: 6px; }
.mirror-diff .diff-item { font-size: 11px; color: #8c8c8c; line-height: 1.5; margin-bottom: 3px; padding-left: 10px; position: relative; }
.mirror-diff .diff-item::before { content: ''; position: absolute; left: 0; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: #faad14; }

.mirror-btns { padding: 0 12px; display: flex; gap: 8px; }
.mirror-btn { flex: 1; height: 40px; border-radius: 20px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }

/* ========== 页面4：能力看板 ========== */
.board-header { padding: 16px; background: #fff; margin-bottom: 8px; }
.board-header .board-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.board-header .board-sub { font-size: 12px; color: #999; }

.board-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 12px; margin-bottom: 12px; }
.board-stat { background: #fff; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.board-stat .stat-num { font-size: 20px; font-weight: 700; }
.board-stat .stat-label { font-size: 10px; color: #999; margin-top: 2px; }

.board-section { padding: 0 12px; margin-bottom: 12px; }
.board-section-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.board-section-title .more { font-size: 11px; font-weight: 400; }

.radar-chart { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 8px; }
.radar-placeholder { width: 180px; height: 180px; margin: 0 auto 6px; }
.radar-placeholder svg { width: 100%; height: 100%; }

.behavior-trace { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 8px; }
.trace-item { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.trace-item:last-child { border-bottom: none; }
.trace-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.trace-text { flex: 1; }
.trace-text .trace-action { font-size: 12px; color: #333; line-height: 1.4; }
.trace-text .trace-learn { font-size: 10px; color: #52c41a; margin-top: 1px; }
.trace-text .trace-time { font-size: 10px; color: #ccc; margin-top: 1px; }

.growth-timeline { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.growth-node { display: flex; gap: 10px; padding-bottom: 12px; position: relative; }
.growth-node:last-child { padding-bottom: 0; }
.growth-node::before { content: ''; position: absolute; left: 11px; top: 22px; bottom: 0; width: 2px; background: #f0f0f0; }
.growth-node:last-child::before { display: none; }
.growth-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; z-index: 1; }
.growth-content { flex: 1; }
.growth-content .gc-title { font-size: 12px; font-weight: 500; line-height: 1.4; }
.growth-content .gc-desc { font-size: 11px; color: #999; margin-top: 1px; }
.growth-content .gc-time { font-size: 10px; color: #ccc; margin-top: 1px; }

/* 底部导航 */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #fff; border-top: 1px solid #eee; display: flex; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.nav-item .nav-icon { font-size: 18px; margin-bottom: 2px; }
.nav-item .nav-label { font-size: 10px; color: #999; }
.nav-item .nav-badge { position: absolute; top: 4px; right: calc(50% - 16px); width: 14px; height: 14px; background: #ff4d4f; border-radius: 50%; font-size: 9px; color: #fff; display: flex; align-items: center; justify-content: center; }
.nav-item { position: relative; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
  <span class="back">‹ 返回</span>
  <span class="title">我的分身</span>
</div>

<!-- 人物切换栏：每个分身技能完全不同 -->
<div class="person-switcher" id="personSwitcher">
  <div class="person-card active" onclick="switchPerson(0)" style="background:#e6f7ff">
    <div class="person-emoji">👩‍💼</div>
    <div class="person-name">林姐</div>
    <div class="person-job">公众号运营</div>
  </div>
  <div class="person-card" onclick="switchPerson(1)" style="background:#fff7e6">
    <div class="person-emoji">👨‍🏫</div>
    <div class="person-name">陈老师</div>
    <div class="person-job">教育培训</div>
  </div>
  <div class="person-card" onclick="switchPerson(2)" style="background:#f6ffed">
    <div class="person-emoji">👨‍🍳</div>
    <div class="person-name">张师傅</div>
    <div class="person-job">餐饮老板</div>
  </div>
  <div class="person-card" onclick="switchPerson(3)" style="background:#fff1f0">
    <div class="person-emoji">👩‍💻</div>
    <div class="person-name">小王</div>
    <div class="person-job">短视频达人</div>
  </div>
  <div class="person-card" onclick="switchPerson(4)" style="background:#f9f0ff">
    <div class="person-emoji">👨‍⚕️</div>
    <div class="person-name">李医生</div>
    <div class="person-job">中医理疗</div>
  </div>
</div>

<!-- 页面切换tabs -->
<div class="page-tabs">
  <div class="page-tab active" onclick="switchPage(0)">分身主页</div>
  <div class="page-tab" onclick="switchPage(1)">分身对话</div>
  <div class="page-tab" onclick="switchPage(2)">案例投喂</div>
  <div class="page-tab" onclick="switchPage(3)">镜像测试</div>
  <div class="page-tab" onclick="switchPage(4)">能力看板</div>
</div>

<!-- 内容区 -->
<div class="content" id="mainContent"></div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item" onclick="switchPage(0)"><span class="nav-icon">🏠</span><span class="nav-label">首页</span></div>
  <div class="nav-item" onclick="switchPage(1)"><span class="nav-icon">💬</span><span class="nav-label">对话</span></div>
  <div class="nav-item" onclick="switchPage(2)"><span class="nav-icon">📖</span><span class="nav-label">投喂</span><span class="nav-badge">2</span></div>
  <div class="nav-item" onclick="switchPage(3)"><span class="nav-icon">🪞</span><span class="nav-label">测试</span></div>
  <div class="nav-item" onclick="switchPage(4)"><span class="nav-icon">📊</span><span class="nav-label">看板</span></div>
</div>

<script>
// ========== 5个不同人物的分身数据 ==========
const personas = [
  {
    id: 'linjie', name: '林姐的分身', emoji: '👩‍💼', job: '公众号运营达人',
    gradient: 'linear-gradient(135deg, #1890ff, #36cfc9)', color: '#1890ff', levelColor: '#e6f7ff', levelText: '#1890ff',
    similarity: 72,
    desc: '正在学习你的运营策略、文案风格和客户沟通方式',
    skills: [
      { icon: '📱', name: '公众号运营', level: '熟练 Lv.3', pct: 72, desc: '掌握了标题包装、粉丝互动、内容排版等核心能力', cases: 12 },
      { icon: '✍️', name: '文案写作', level: '进阶 Lv.2', pct: 48, desc: '学会了你的表达风格和常用句式', cases: 5 },
      { icon: '🤝', name: '客户沟通', level: '入门 Lv.1', pct: 20, desc: '刚接触，还需更多经验投喂', cases: 1 }
    ],
    questions: [
      { ctx: '📱 公众号运营 · 素材选择', text: '主人，我接到一个教育号推广订单，你之前做这类时，会优先用哪类封面图？', time: '5分钟前' },
      { ctx: '✍️ 文案写作 · 语气风格', text: '主人，你写美食探店文案时，会不会用第一人称视角？', time: '1小时前' }
    ],
    chat: {
      ai1: '主人，我刚接到一个美食号推广的订单。我记得你说过，美食类文案不要用"好吃到哭"这种空洞词，要写具体感官体验，对吧？',
      learn1: '已从案例库学习：美食文案原则 #3',
      user1: '对，记住要写具体的，比如"筷子一夹就断，汁水顺着手指往下淌"。还有，美食文案开头一定要有画面感，让读者能"看得到味道"。',
      ai2: '记住了！我总结一下：1. 不用空洞形容词，用具象感官描写 2. 开头要有画面感 3. 让读者"看得到味道"。还有一点我想确认——你写美食文案时，会不会加入自己的真实体验感受？',
      learn2: '已提取新经验：美食文案开头原则',
      user2: '会加的，但不能太假。如果是真的去过，就写真实感受；如果是帮客户推广没去过，就只描述食物本身。这点很重要，别翻车。',
      ai3: '明白！这很关键。我记下了：<b>美食文案诚信原则：</b>真实体验→写个人感受；未亲体验→只描述食物；绝不虚构体验。',

      </div>
      <div class="board-section">
        <div class="board-section-title">成长时间线</div>
        <div class="growth-timeline">
          ${p.growth.map(g => `
            <div class="growth-node">
              <div class="growth-dot" style="background:${g.bg}">${g.dot}</div>
              <div class="growth-content"><div class="gc-title">${g.title}</div><div class="gc-desc">${g.desc}</div><div class="gc-time">${g.time}</div></div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  }

  c.innerHTML = html;
}

// 初始渲染
renderPage(0);
</script>
</body>
</html>
