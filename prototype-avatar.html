<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
<title>莫瑞娜 - 人机共生平台原型 v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }

/* 顶部导航 */
.top-nav { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: center; z-index: 100; }
.top-nav .title { font-size: 16px; font-weight: 600; }

/* 人物切换栏 */
.person-switcher { position: fixed; top: 44px; left: 0; right: 0; height: 68px; background: #fff; z-index: 99; border-bottom: 1px solid #eee; display: flex; padding: 8px 12px; gap: 8px; overflow-x: auto; white-space: nowrap; }
.person-switcher::-webkit-scrollbar { display: none; }
.person-card { flex: 0 0 auto; width: 80px; height: 52px; border-radius: 12px; padding: 4px 6px; cursor: pointer; transition: all .2s; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.person-card.active { border-color: #1890ff; background: #e6f7ff; }
.person-card .emoji { font-size: 18px; }
.person-card .name { font-size: 10px; color: #666; font-weight: 500; margin-top: 2px; }
.person-card.active .name { color: #1890ff; }

/* 页面切换 */
.page-tabs { position: fixed; top: 112px; left: 0; right: 0; height: 38px; background: #fff; display: flex; z-index: 98; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
.page-tabs::-webkit-scrollbar { display: none; }
.page-tab { flex: 0 0 auto; padding: 0 14px; height: 38px; line-height: 38px; font-size: 13px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
.page-tab.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }

.content { margin-top: 150px; padding-bottom: 40px; min-height: calc(100vh - 150px); }
.page { display: none; padding: 12px; }
.page.active { display: block; }

/* 通用组件 */
.card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.badge-blue { background: #e6f7ff; color: #1890ff; }
.badge-green { background: #f6ffed; color: #52c41a; }
.badge-orange { background: #fff7e6; color: #fa8c16; }
.badge-red { background: #fff1f0; color: #f5222d; }
.badge-purple { background: #f9f0ff; color: #722ed1; }

.tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #f5f5f5; color: #666; margin: 2px 4px 2px 0; }
.tag-active { background: #e6f7ff; color: #1890ff; }

.divider { height: 1px; background: #f0f0f0; margin: 12px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary { background: #1890ff; color: #fff; }
.btn-outline { background: #fff; color: #1890ff; border: 1px solid #1890ff; }
.btn-block { width: 100%; }

.progress-bar { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }

/* ===== 页面0：分身主页 ===== */
.avatar-hero { background: linear-gradient(135deg, #1890ff, #722ed1); border-radius: 16px; padding: 20px; color: #fff; margin-bottom: 12px; position: relative; overflow: hidden; }
.avatar-hero::after { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.avatar-hero .avatar-info { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.avatar-hero .avatar-circle { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 26px; border: 2px solid rgba(255,255,255,0.4); }
.avatar-hero .avatar-name { font-size: 18px; font-weight: 700; }
.avatar-hero .avatar-tagline { font-size: 12px; opacity: 0.85; margin-top: 3px; }
.avatar-hero .stats-row { display: flex; gap: 16px; }
.avatar-hero .stat-item { flex: 1; text-align: center; }
.avatar-hero .stat-num { font-size: 20px; font-weight: 700; }
.avatar-hero .stat-label { font-size: 10px; opacity: 0.7; margin-top: 2px; }

.insight-timeline { padding-left: 16px; border-left: 2px solid #e6f7ff; }
.insight-item { position: relative; padding: 0 0 16px 12px; }
.insight-item::before { content: ''; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #1890ff; border: 2px solid #fff; }
.insight-item .insight-time { font-size: 10px; color: #999; margin-bottom: 2px; }
.insight-item .insight-text { font-size: 12px; color: #333; line-height: 1.6; }
.insight-item .insight-source { font-size: 10px; color: #1890ff; margin-top: 3px; }

.live-indicator { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #52c41a; font-weight: 500; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #52c41a; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== 页面1：行为学习 ===== */
.learn-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-left: 3px solid #1890ff; }
.learn-card .learn-source { font-size: 10px; color: #999; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.learn-card .learn-raw { font-size: 12px; color: #666; background: #fafafa; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; line-height: 1.5; }
.learn-card .learn-extracted { font-size: 13px; color: #333; padding: 8px 10px; background: #f0f9ff; border-radius: 8px; border: 1px solid #d6e4ff; line-height: 1.6; }
.learn-card .learn-extracted::before { content: '💡 提炼出'; font-size: 10px; color: #1890ff; font-weight: 600; display: block; margin-bottom: 4px; }

.compare-box { display: flex; gap: 8px; margin: 8px 0; }
.compare-side { flex: 1; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.6; }
.compare-original { background: #fff1f0; border: 1px solid #ffccc7; }
.compare-modified { background: #f6ffed; border: 1px solid #b7eb8f; }
.compare-label { font-size: 10px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

/* ===== 页面2：分身对话 ===== */
.chat-container { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.chat-messages { padding: 14px; max-height: 400px; overflow-y: auto; }
.chat-msg { margin-bottom: 14px; }
.chat-msg.user { text-align: right; }
.chat-msg .bubble { display: inline-block; max-width: 80%; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.6; text-align: left; }
.chat-msg.user .bubble { background: #1890ff; color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.avatar .bubble { background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
.chat-msg .msg-time { font-size: 10px; color: #999; margin-top: 3px; }
.chat-msg .learned-tag { font-size: 10px; color: #52c41a; font-weight: 500; margin-top: 3px; display: flex; align-items: center; gap: 3px; }
.chat-input { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #f0f0f0; }
.chat-input input { flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #e8e8e8; font-size: 13px; outline: none; }
.chat-input button { padding: 8px 16px; border-radius: 20px; background: #1890ff; color: #fff; border: none; font-size: 13px; cursor: pointer; }

/* ===== 页面3：镜像测试 ===== */
.mirror-question { background: #fffbe6; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #ffe58f; }
.mirror-question .q-label { font-size: 10px; color: #fa8c16; font-weight: 600; margin-bottom: 6px; }
.mirror-answer { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.mirror-answer .answer-label { font-size: 11px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.mirror-answer .answer-text { font-size: 13px; line-height: 1.7; color: #333; }
.diff-highlight { background: #fff1f0; padding: 1px 4px; border-radius: 3px; color: #f5222d; font-weight: 500; }
.same-highlight { background: #f6ffed; padding: 1px 4px; border-radius: 3px; color: #52c41a; font-weight: 500; }
.mirror-result { background: #f6ffed; border-radius: 12px; padding: 14px; border: 1px solid #b7eb8f; }
.mirror-result .result-title { font-size: 13px; font-weight: 600; color: #52c41a; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }

/* ===== 页面4：价值场景 ===== */
.scene-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.scene-card .scene-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.scene-card .scene-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.scene-card .scene-title { font-size: 15px; font-weight: 600; }
.scene-card .scene-desc { font-size: 11px; color: #999; }
.scene-card .scene-flow { display: flex; align-items: center; gap: 4px; padding: 10px; background: #fafafa; border-radius: 8px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
.scene-card .flow-step { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: #e6f7ff; color: #1890ff; font-weight: 500; }
.scene-card .flow-arrow { color: #ccc; font-size: 12px; }
.scene-card .scene-value { font-size: 12px; color: #666; line-height: 1.7; }
.scene-card .scene-value strong { color: #1890ff; }

/* ===== 页面5：人格画像 ===== */
.personality-section { margin-bottom: 14px; }
.personality-section .section-label { font-size: 12px; color: #999; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.trait-card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 6px; border: 1px solid #f0f0f0; }
.trait-card .trait-text { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.trait-card .trait-evidence { font-size: 11px; color: #999; line-height: 1.5; }
.trait-card .trait-evidence::before { content: '证据：'; color: #bbb; }
.trait-card .trait-confidence { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.trait-card .trait-confidence .conf-bar { flex: 1; height: 4px; background: #f0f0f0; border-radius: 2px; overflow: hidden; }
.trait-card .trait-confidence .conf-fill { height: 100%; border-radius: 2px; }
.trait-card .trait-confidence .conf-num { font-size: 10px; color: #999; white-space: nowrap; }
.trait-card .trait-source { font-size: 10px; color: #bbb; margin-top: 4px; }

</style>
</head>
<body>

<div class="top-nav"><span class="title">莫瑞娜 · 人机共生</span></div>

<div class="person-switcher" id="personSwitcher"></div>

<div class="page-tabs" id="pageTabs">
  <div class="page-tab active" data-page="0">分身主页</div>
  <div class="page-tab" data-page="1">行为学习</div>
  <div class="page-tab" data-page="2">分身对话</div>
  <div class="page-tab" data-page="3">镜像测试</div>
  <div class="page-tab" data-page="4">价值场景</div>
  <div class="page-tab" data-page="5">人格画像</div>
</div>

<div class="content" id="contentArea"></div>

<script>
// ===== 人物数据 =====
const PERSONS = {

    learnings: [
      { time: '3分钟前', source: '你修改了文案', raw: 'AI写：限时优惠，错过就没有了！\n你改为：这个方法很多家长都在用，效果不错', extracted: '偏好建设性引导而非制造焦虑', icon: '✏️' },

    chat: [
      { role: 'user', text: '有个教育客户想推广幼小衔接课程，怎么写？' },
      { role: 'avatar', text: '我先确认下——客户的目标家长是80后还是90后？如果是80后我会用"专业背书+权威数据"的路线，比如"北师大教授推荐的衔接方法"；如果是90后我会走"同龄人分享+场景代入"，比如"我也是妈妈，这是我给孩子选的"。之前你3次都是先问客户群体再定方向的，对吗？', learned: '确认了你的决策模式：先问客户群体再选策略' },

function renderTrait(t) {
  const confColor = t.confidence >= 0.9 ? '#52c41a' : t.confidence >= 0.7 ? '#fa8c16' : '#999';
  const confLabel = t.confidence >= 0.9 ? '高确信' : t.confidence >= 0.7 ? '较确信' : '待确认';
  const sourceLabel = t.source === 'auto_observed' ? '自动观察' : t.source === 'behavior_log' ? '行为日志' : t.source === 'user_stated' ? '你亲口说的' : '案例提取';
  return `
    <div class="trait-card">
      <div class="trait-text">${t.text}</div>
      <div class="trait-evidence">${t.evidence}</div>
      <div class="trait-confidence">
        <div class="conf-bar"><div class="conf-fill" style="width: ${t.confidence * 100}%; background: ${confColor};"></div></div>
        <div class="conf-num" style="color: ${confColor};">${Math.round(t.confidence * 100)}% ${confLabel}</div>
      </div>
      <div class="trait-source">来源：${sourceLabel}</div>
    </div>
  `;
}

document.getElementById('pageTabs').addEventListener('click', e => {
  const tab = e.target.closest('.page-tab');
  if (!tab) return;
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page' + tab.dataset.page);
  if (page) page.classList.add('active');
});

// 初始渲染
renderAll();
</script>
</body>
