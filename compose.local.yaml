services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mrl}
      MYSQL_USER: ${MYSQL_USER:-mrl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mrl_local_password}
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    image: ${SERVER_IMAGE:-morena-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      WECHAT_PAY_MOCK: ${WECHAT_PAY_MOCK:-1}
      STORAGE_MOCK: ${STORAGE_MOCK:-1}
      LOCAL_UPLOAD_BASE_URL: ${LOCAL_UPLOAD_BASE_URL:-http://127.0.0.1:3000}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mrl}
      MYSQL_USER: ${MYSQL_USER:-mrl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mrl_local_password}
    command: ["node", "dist/src/main.js"]
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server/dist:/app/server/dist:ro
      - uploads_data:/app/uploads

  web:
    image: ${WEB_IMAGE:-morena-server:latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      PORT: 5000
      STATIC_ROOT: /site
      API_TARGET_HOST: server
      API_TARGET_PORT: 3000
    command: ["node", "/server.js"]
    ports:
      - "${WEB_EXPOSE_PORT:-5001}:5000"
    volumes:
      - ./.docker-dist-web:/site:ro
      - ./.docker-static-server.js:/server.js:ro

volumes:
  mysql_data:
  uploads_data:
