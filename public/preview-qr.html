<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H5 预览二维码</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .qr-wrapper {
      margin: 30px 0;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 12px;
      display: inline-block;
    }
    .qr-code {
      width: 256px;
      height: 256px;
      display: block;
    }
    .instructions {
      text-align: left;
      margin-top: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    .instructions h2 {
      color: #667eea;
      font-size: 18px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .instructions ol {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
      padding-left: 20px;
    }
    .instructions li {
      margin-bottom: 10px;
    }
    .warning {
      margin-top: 20px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 8px;
      color: #856404;
      font-size: 13px;
      line-height: 1.6;
    }
    .warning strong {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .url {
      margin-top: 20px;
      padding: 10px;
      background: #e7f3ff;
      border-radius: 6px;
      color: #0066cc;
      font-size: 14px;
      word-break: break-all;
      font-family: monospace;
    }
    .url strong {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-family: inherit;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 H5 预览二维码</h1>
    
    <div class="qr-wrapper">
      <img src="/preview-qrcode.png" alt="H5 预览二维码" class="qr-code" />
    </div>
    
    <a href="http://9.128.8.35:5000" target="_blank" class="btn">🚀 直接打开 H5 预览</a>
    
    <div class="url">
      <strong>预览 URL:</strong>
      http://9.128.8.35:5000
    </div>
    
    <div class="instructions">
      <h2>📖 使用说明</h2>
      <ol>
        <li>用手机微信扫描上方二维码</li>
        <li>选择"在浏览器中打开"</li>
        <li>体验 H5 网页版（功能与小程序基本一致）</li>
      </ol>
    </div>
    
    <div class="warning">
      <strong>⚠️ 注意事项</strong>
      请确保您的手机与服务器在同一网络中。如果无法访问，请使用微信开发者工具生成小程序预览二维码。
    </div>
  </div>
</body>
</html>
